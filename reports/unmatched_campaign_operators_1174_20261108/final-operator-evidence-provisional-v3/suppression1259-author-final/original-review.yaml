    Congocidin EXACT_SYNONYM at synonyms[1], Congocidine at [2], and preserved raw
    preferred label. Credited Congocidin remains byte-identical kgmicrobe.compound:congocidin,
    mapping_status MAPPED but mapping_quality PLACEHOLDER, old no-hit provenance and
    no verified supplied_form. The native complete-index function credits this record
    despite that unresolved scientific state. Retained holds: SUPPRESS is CONDITIONAL
    routing recommendation only. The §3 resolved-owner wording cannot be used to certify
    the PLACEHOLDER scientifically resolved because native membership includes it.
    Final owner/source-form reconciliation and actual row admission remain held. The
    existing local primary is not a newly approved external identity. Do not merge
    Netropsin/Congocidin or infer salt/neutral form from NLM narrower concepts or
    mixed PubChem synonyms. No automatic suppression of Congocidine: that different
    token has no credited-owner collision in this four-pair scope and remains in candidate
