    ontology-label token is legitimate, and its preferred-name owner exists separately.
  details: 'The original 1990 biosynthetic research abstract PMID1698764 explicitly
    identifies Bluensomycin (glebomycin) in a detailed aminocyclitol comparison. The
    current official ChEBI81193 capture supplies the same formula, molecular weight,
    stereochemical SMILES and InChI as the credited Bluensomycin owner. This is evidence
    for the name relationship, not a source observation of a purchased salt, concentration,
    preparation or lot. Emitter NCIT:C90636 with ontology label Bluensomycin, SYNONYM_MATCH,
    MAPPED and SINGLE_INGREDIENT; source token only ontology_mapping.ontology_label.
    Credited owner remains authentic unchanged CHEBI:81193 EXACT_MATCH with complete
    structure. Original lexical evidence and new LITERATURE record remain both present;
    history prefix preserved. Retained holds: No automatic Glebomycin/Bluensomycin
    owner merge or replacement of the two historical identifiers. No assigned hydrochloride/sulfate/hydrate,
    concentration, preparation, supplier or source-organism role. Inherited SELECTIVE_AGENT
    computational role and whole-row mapping/admission remain outside this pair policy. '
