identifier: CHEBI:38888
preferred_term: Na2B4O7 x 10 H2O
ontology_mapping:
  ontology_id: CHEBI:38888
  ontology_label: disodium tetraborate octahydrate
  ontology_source: CHEBI
  mapping_quality: EXACT_MATCH
  evidence:
  - evidence_type: MANUAL_CURATION
    source: https://journals.iucr.org/e/issues/2008/05/00/wm2174/wm2174.pdf
    notes: The source conventional sodium tetraborate decahydrate formula Na2B4O7·10H2O
      and structural borax formula Na2[B4O5(OH)4]·8H2O denote the same bulk material.
      Gainsford etal2008 DOI10.1107/S1600536808010441 explicitly identifies sodium
      tetraborate decahydrate as the latter structural formula, with Mr381.38. Official
      CHEBI38888 has that structural formula and381.371 mass; its octahydrate label
      counts the eight molecular waters after hydroxylation and does not mean Na2B4O7·8H2O.
      Official supplier CAS1303-96-4/Na2B4O7·10H2O/MW381.37 independently corroborates
      supplied form. CHEBI131366 and86222 instead contain two excess waters and remain
      upstream defects. This identity proposal covers explicitly weighed decahydrate
      reagent contexts; DSMZ7700.1%w/v stock remains a distinct preparation, so no
      global mediadive.ingredient:196 exact redirect is approved.
  - evidence_type: DATABASE_MATCH
    source: https://www.ebi.ac.uk/ols4/api/ontologies/chebi/terms?obo_id=CHEBI:38888
    notes: Live official structural formula and mass agree with the primary borax
      structure; exact label retained.
