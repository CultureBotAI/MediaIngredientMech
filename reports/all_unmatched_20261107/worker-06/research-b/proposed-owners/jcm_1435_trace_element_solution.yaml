  notes: JCM1435 dissolves NTA first in200ml of the preparation water and adjusts pH6.5 with KOH, then
    adds remaining salts and adjusts volume to1000ml, finally readjusting pH6.5. The listed1L water is
    retained as source batch formulation text; it is not an additional1L beyond the volumetric make-up.
    Initial KOH amount/strength and final readjustment reagent are unspecified, so closure is UNKNOWN.
    The parent LIMNOCHORDIA LN medium uses10ml. Distinct from JCM1465 stock with raw H3BO2, and from NBRC1226
    Fe(III) stock.
