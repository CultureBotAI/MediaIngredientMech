notes: 'Recipe-defined JCM197 vitamin stock; local formulation identity, with no exact
  ontology identity or whole-medium claim. Occurrence counts not recomputed in the
  isolated proposal. NBRC837 trace vitamins*** has the same ten named vitamins, amounts
  and 1 L distilled water: biotin2mg, folic acid2mg, pyridoxine-HCl10mg, thiamine-HCl5mg,
  riboflavin5mg, nicotinic acid5mg, Ca-pantothenate5mg, vitaminB12 0.1mg, p-aminobenzoic
  acid5mg and lipoic acid5mg. Its source requires filter sterilization. This supports
  only its occurrence-specific formulation link; the generic starred text is not a
  global synonym. Source-specific preparation: JCM197 requires filter sterilizing
  the vitamin solution while gassing with N2. NBRC837 requires filter-sterile vitamin
  addition aseptically and anaerobically, but does not explicitly state stock gassing.
  The shared listed formulation does not assert identical unreported gas preparation.'
