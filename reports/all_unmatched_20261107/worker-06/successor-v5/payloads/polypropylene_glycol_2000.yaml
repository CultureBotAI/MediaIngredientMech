notes: Bounded nominal polypropylene glycol 2000 material named by NBRC1400; not a
  fixed molecular species. SINGLE_INGREDIENT denotes recipe-ingredient granularity,
  not purity or a homogeneous chain length. The receiving recipe lists 2.0 g of this
  material, separately lists distilled water 1 L, and instructs sonication of the
  medium excluding agar until PPG2000 is emulsified. These are receiving-medium inputs/process,
  not evidence of a supplied aqueous stock or an intrinsic 2 g/L material concentration,
  and the added water is not assumed to be measured final volume. Supplier, catalogue,
  molecular-weight distribution, the definition of the nominal 2000 average, end groups
  and supplied physical form are unknown. No fixed molecular weight, formula, SMILES,
  InChI, CAS, PEG/monomer identity, repeat-unit component, nutritional role or product
  approval is inferred. Supplier examples establish that nominal polymer grades are
  representable; they do not establish NBRC procurement. Applicability is bounded
  to the preserved NBRC1400 occurrence; cross-source material equivalence requires
  comparison.
