  evidence:
  - evidence_type: CURATOR_JUDGMENT
    source: https://www.dsmz.de/microorganisms/medium/pdf/DSMZ_Medium110a.pdf; https://togomedium.org/medium/M2717
    notes: DSMZ110a defines a filtered meat extract with lean beef OR horse meat alternatives;
      neither occurrence-level choice nor equivalence of these alternatives is asserted.
      The DSMZ table uses 500 g meat, 25 ml 1 N NaOH and 975 ml initial water; TOGO
      M2717 instead tabulates 1000 ml water. Both describe making the resulting filtrate
      up to 1000 ml. These are source-version alternatives, not reconciled quantities.
      Extraction/filtration do not prove unchanged meat or NaOH remain in the filtrate.
      Only water is recorded as a demonstrated retained part; composition and dissolved
      extraction products remain unspecified. No verified exact eligible ontology
      term or existing whole-preparation owner was established by the bounded source/owner
      review. This self-registry mapping represents the preparation, not its individual
      constituents.
