    notes: 'JCM149 explicitly defines its standard mineral base as phosphate buffer,
      Hutner vitamin-free mineral base, ammonium sulfate and water. The nested buffer
      and Hutner preparation remain named source-qualified parts, not a flattened
      complete chemical formula. One litre water is an input amount, not a verified
      final volume. Source transcription basis (literal input amounts, not calculated
      stock concentrations): 1 M Na2HPO4--KH2PO4 buffer (pH 6.8): 40 ml; Distilled
      water: 1 L; (NH4)2SO4: 1 g; Hutner''s vitamin free mineral base (see below):
      20 ml. No batch-to-final-volume conversion is made. Handling atmosphere is not
      listed as a material part; pH reagents are source inputs, without an assertion
      of unchanged molecular species after pH adjustment. Nested formulations remain
      source-qualified named parts where exact composition/owner identity is not established.
      No verified exact eligible ontology term or existing whole-preparation owner
      was established by the bounded source/owner review. This self-registry mapping
      represents the preparation, not its individual constituents.'
