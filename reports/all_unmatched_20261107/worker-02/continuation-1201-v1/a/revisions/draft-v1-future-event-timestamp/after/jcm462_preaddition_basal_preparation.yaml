    source: https://www.jcm.riken.jp/cgi-bin/jcm/jcm_grmd?GRMD=462; https://togomedium.org/medium/M463
    notes: 'JCM462 instructions exclude bicarbonate, vitamin solution, thiamine, B12,
      lactate and sulfide from the prepared basal material. The provider grouping
      includes three later vitamin stocks; these are excluded here. Riboflavin and
      selenite-tungstate remain source-listed basal inputs. Source transcription basis
      (literal input amounts, not calculated stock concentrations): Distilled water:
      900 ml; NaCl: 20 g; CaCl2・2H2O: 0.15 g; KH2PO4: 0.6 g; NH4Cl: 0.75 g; Resazurin:
      1 mg; MgCl2・6H2O: 3 g; KCl: 0.5 g; Na2SO4: 4 g; KBr: 0.09 g; Trace element solution
      (see Medium [M439]): 1 ml; Riboflavin (see below): 1 ml; Selenite--tungstate
      solution (see Medium [M431]): 1 ml. No batch-to-final-volume conversion is made.
      Handling atmosphere is not listed as a material part; pH reagents are source
      inputs, without an assertion of unchanged molecular species after pH adjustment.
      Nested formulations remain source-qualified named parts where exact composition/owner
      identity is not established. No verified exact eligible ontology term or existing
      whole-preparation owner was established by the bounded source/owner review.
      This self-registry mapping represents the preparation, not its individual constituents.'
