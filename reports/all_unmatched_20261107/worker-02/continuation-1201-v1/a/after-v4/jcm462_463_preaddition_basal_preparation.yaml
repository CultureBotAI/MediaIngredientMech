  evidence:
  - evidence_type: CURATOR_JUDGMENT
    source: https://www.jcm.riken.jp/cgi-bin/jcm/jcm_grmd?GRMD=462; https://www.jcm.riken.jp/cgi-bin/jcm/jcm_grmd?GRMD=463;
      https://togomedium.org/medium/M463; https://togomedium.org/medium/M464
    notes: 'Original JCM463 explicitly uses JCM462 with changes only to separately
      added carbon/electron-acceptor and reducer inputs: sodium lactate is replaced
      by 20 mM sodium acetate and 30 mM ferric citrate, sodium sulfide is omitted,
      and 0.5 g/L L-cysteine-HCl is added separately. These late inputs are outside
      this pre-addition basal material. Its source-listed basal components and quantities
      therefore share the JCM462 formulation. TOGO M464 riboflavin pointer to M463
      resolves to JCM462, whose nested riboflavin preparation lists 2.5 mg riboflavin
      with 100 ml added water. The 1 ml riboflavin input is a named preparation part;
      no final volume or derived stock concentration is invented. Both original occurrence
      and source-version scopes remain explicit; this does not equate the complete
      growth media. Bounded whole-preparation local identity; no pure constituent
      grounding.'
synonyms: []
notes: 'Original JCM463 explicitly uses JCM462 with changes only to separately added
  carbon/electron-acceptor and reducer inputs: sodium lactate is replaced by 20 mM
  sodium acetate and 30 mM ferric citrate, sodium sulfide is omitted, and 0.5 g/L
  L-cysteine-HCl is added separately. These late inputs are outside this pre-addition
  basal material. Its source-listed basal components and quantities therefore share
  the JCM462 formulation. TOGO M464 riboflavin pointer to M463 resolves to JCM462,
  whose nested riboflavin preparation lists 2.5 mg riboflavin with 100 ml added water.
  The 1 ml riboflavin input is a named preparation part; no final volume or derived
  stock concentration is invented. Both original occurrence and source-version scopes
  remain explicit; this does not equate the complete growth media. The inherited JCM462
  instructions exclude bicarbonate, vitamin solution, thiamine, B12, lactate and sulfide
  from the prepared basal material. The provider grouping includes three later vitamin
  stocks; these are excluded here. Riboflavin and selenite-tungstate remain source-listed
  basal inputs. Source transcription basis (literal input amounts, not calculated
  stock concentrations): Distilled water: 900 ml; NaCl: 20 g; CaCl2・2H2O: 0.15 g;
  KH2PO4: 0.6 g; NH4Cl: 0.75 g; Resazurin: 1 mg; MgCl2・6H2O: 3 g; KCl: 0.5 g; Na2SO4:
  4 g; KBr: 0.09 g; Trace element solution (see Medium [M439]): 1 ml; Riboflavin (see
  below): 1 ml; Selenite--tungstate solution (see Medium [M431]): 1 ml. No batch-to-final-volume
  conversion is made. Handling atmosphere is not listed as a material part; pH reagents
  are source inputs, without an assertion of unchanged molecular species after pH
  adjustment. Nested formulations remain source-qualified named parts where exact
  composition/owner identity is not established. Raw source labels and original occurrence
  IDs remain in the evidence ledger; no recipe-local label is activated as a global
  synonym. All inherited release holds remain.'
