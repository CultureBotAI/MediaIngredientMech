limitations:
- Completed independent scientific review is a needs-curation observation, not owner,
  source-outcome release, role, cross-shard merge or export approval. All337 frozen
  hold objects remain preserved.
- Actual read registers distinguish inspected primary captures, failed retrievals,
  unread papers, historical/secondary context and hash-only checks; no unread full
  paper is claimed inspected. Restricted-network retries and provider failures are
  recorded.
- Guarded schema/writer/partonomy and receipt checks pass on private exact-byte overlays.
  Partonomy can accept labels from an active record's entire synonym list, including
  REJECTED_LABEL; that behavior is not scientific synonym approval.
- The unchanged1021 archived native reviews and unchanged full ontology validations
  were not rerun; exact saved receipts, inputs and database hashes were independently
  checked. No exports or downstream rebuild were run.
- Issue searches are bounded to captured referenced threads, paginated comments, open
  issue bodies and explicit all-state queries; they do not prove global absence across
  all GitHub comments. No GitHub mutation occurred.
- Worker04 proposal overlap is recorded without approving worker04 own authored payloads
  or choosing a cross-shard winner. Existing source-case and whole-owner holds remain.
- The native review is saved only in the explicitly authorized private review directory.
  This overrides the ordinary maintained reviews/structured persistence location;
  native schema/rendering/source verification are used without author or corpus writes.
