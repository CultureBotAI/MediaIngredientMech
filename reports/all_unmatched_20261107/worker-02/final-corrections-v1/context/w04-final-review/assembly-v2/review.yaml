- assessment_id: case-109
  area: identity
  topic: Entire source disposition, primary evidence and remaining work
  outcome: concern
  summary: 'NBRC869 says dithionite(ca.)20mg and instructs adding dithionite solution.
    Ca. is approximate, not calcium. No counterion or defined stock strength is established;
    the nested chemical label cannot be exactly grounded to sodium dithionite. The
    no-change disposition is defensible for the requested chemical identity, while
    any future source-qualified preparation must explicitly retain all these unknowns.
    Addendum governs over earlier review where stated: Prepare a bounded NBRC869 dithionite
    preparation representation with honest partial/unknown composition, or reconcile
    an existing matching preparation if found. Source-qualified preparation identity
    is supported even though exact salt identity is not. Use an unresolved source-literal
    component without component_id and no concentration, or no component assertion
    if components cannot be asserted; do not map the whole preparation to CHEBI42160
    or CHEBI66870. Retained hold: Exact purchasable salt/form, full formulation and
    global source-label identity remain unresolved after preparation curation.'
