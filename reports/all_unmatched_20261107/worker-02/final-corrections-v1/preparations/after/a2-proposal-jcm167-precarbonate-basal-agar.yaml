      Sodium glutamate: 1 g; Agar: 20 g; Yeast extract (BD-Difco): 5 g; Casamino acids
      (BD-Difco): 5 g; SL-6 trace element solution (see below): 1 ml. No batch-to-final-volume
      conversion is made. Handling atmosphere is not listed as a material part; pH
      reagents are source inputs, without an assertion of unchanged molecular species
      after pH adjustment. Nested formulations remain source-qualified named parts
      where exact composition/owner identity is not established. No verified exact
      eligible ontology term or existing whole-preparation owner was established by
      the bounded source/owner review. This self-registry mapping represents the preparation,
      not its individual constituents. JCM167 explicitly requires water q.s. to a
      final900mL basal preparation before the separately prepared carbonate solution
      is added. Provider water900mL table wording is not a measured900mLwater input.
      No component quantity or final concentration was inferred.'
