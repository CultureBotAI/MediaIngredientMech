  notes: 'Completeness concerns the source constituent list, not ontology resolution.
    UNMAPPED parts preserve literal source wording and do not assert an unsupported
    exact ID. The primary JCM 900 and JCM 979 stock subrecipes specify the same nine
    named inputs, quantities, Metals 44 reference to JCM 149 and preparation: dissolve
    NTA, adjust to pH 7.0 with about 7.3 g KOH, add the remaining ingredients, and
    readjust to pH 6.8 with NaOH or H2SO4. Parent media and vitamin supplements differ
    outside this stock boundary. The literal malformed (NH4)6MoO24·4H2O remains unresolved;
    no heptamolybdate correction or exact chemical-component equivalence is asserted.
    Raw source names Hutner''s basal salts (see below) and Modified Hutner''s basal
    salts remain in the frozen case evidence; neither becomes a global stock synonym.
    The canonical proposed local registry identifier retains JCM 900 provenance and
    also covers this verified JCM 979 subrecipe.'
notes: 'The primary JCM 900 and JCM 979 stock subrecipes specify the same nine named
  inputs, quantities, Metals 44 reference to JCM 149 and preparation: dissolve NTA,
  adjust to pH 7.0 with about 7.3 g KOH, add the remaining ingredients, and readjust
  to pH 6.8 with NaOH or H2SO4. Parent media and vitamin supplements differ outside
  this stock boundary. The literal malformed (NH4)6MoO24·4H2O remains unresolved;
  no heptamolybdate correction or exact chemical-component equivalence is asserted.
  Raw source names Hutner''s basal salts (see below) and Modified Hutner''s basal
  salts remain in the frozen case evidence; neither becomes a global stock synonym.
  The canonical proposed local registry identifier retains JCM 900 provenance and
  also covers this verified JCM 979 subrecipe. Issue1237 MIN-F02: Comparison with
  DSM590/1144 remains unresolved at complete chemical/preparation scope. JCM149 Metals44
  prints EDTA·2Na and MnSO4·xH2O; DSM prints Na-EDTA and MnSO4·H2O plus a few drops
  of concentrated H2SO4. Unspecified hydration, salt detail or an unreported acid
  step does not prove incompatibility or equivalence. The historical malformed molybdate
  strings remain literal unresolved assertions. Positively different JCM149 outer
  Hutner mineral base has MgSO4·7H2O 14.45 g versus 29.7 g in JCM900/979; that outer
  recipe is distinct from the nested Metals44 reference. JCM631 also retains its positively
  different Mg/Ca quantities and vitamin inputs. All present immediate inputs remain
  unchanged; COMPLETE is source-list completeness, not resolved molecular identity.'
