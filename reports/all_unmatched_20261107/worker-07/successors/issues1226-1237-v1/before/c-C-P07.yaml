notes: Imported from mim-queue (source_id=mediadive.ingredient:1989); no CAS-RN or
  CHEBI/NCIT match. Reviewed on 2026-05-11 as a named medium/formulation pending recipe-level
  curation. JCM 1081 and 1082 explicitly use sterilized basal mineral NaCl medium
  from JCM 1079. Proposed boundary includes the initial 4 salts/buffer plus distilled-water
  base and the four post-cooling stocks listed before the instruction To complete
  the medium. It excludes the subsequent sulfur, sodium pyruvate, yeast extract and
  sodium sulfide additions. Initial amounts and stock aliquots remain literal component
  notes; no final-volume-normalized concentration is invented after the 13 mL stock
  additions. The nine listed inputs completely enumerate this bounded basal preparation.
  Referenced stock subcomponents are not recursively resolved; chemical-resolution
  uncertainty does not make the declared input list partial.
