  evidence:
  - evidence_type: MANUAL_CURATION
    source: https://www.dsmz.de/microorganisms/medium/pdf/DSMZ_Medium1673.pdf
    notes: Nominal source-qualified350 g/L magnesium sulfate heptahydrate stock, explicitly
      identified in DSMZ1673/1677/1678. Six exact CultureMech occurrences refer to
      this strength, distinct from C-P08 at7.5 g/L and from pure CHEBI:31795. DSMZ1673
      specifies10 mL/L stock. DSMZ1677 prints3.30 g beside the350 g/L stock qualifier
      while MediaDive5781 gives3.3 mL and an inconsistent g_l field; DSMZ1678 specifies3.3
      mL/L while MediaDive5782 usesg/L. The1677/1678 dose conflicts remain held pending
      authoritative clarification; no corrected dose or final-medium concentration
      is inferred. All three sources explicitly support the nominal stock strength,
      regardless of unresolved dispensing units. Solvent, complete composition and
      stock preparation/final-volume convention are unreported. Instructions to make
      the whole medium up with water do not establish the stock solvent. Component-list
      completeness remains UNKNOWN. This records the common stated nominal source
      formulation, not proven equality of unreported preparation details or every
      ingredient2154 occurrence. The raw source label is retained in evidence, not
      added as a global resolving stock or solute synonym. Occurrence statistics count
      six distinct frozen recipe records in this reviewed scope, not unique biological
      media.
