  evidence:
  - evidence_type: MANUAL_CURATION
    source: https://www.jcm.riken.jp/cgi-bin/jcm/jcm_grmd?GRMD=1270
    notes: JCM1270 explicitly weighs44g BD-Difco Columbia blood agar base, then separately
      adds water and sheep blood. Manufacturer manual distinguishes Difco44g/L base
      from BBL42.5g/L and EH39g/L variants. This source-qualified owner denotes the
      dry Difco input; it does not reuse MICRO536 whose definition transcribes the
      BBL formulation. Typical constituent names are retained without historical lot
      or dry-mass-ratio claims.
  - evidence_type: LLM_SUGGESTION
    source: https://fsl.nmsu.edu/documents/difcobblmanual_2nded_lowres.pdf
    notes: LLM-assisted source comparison and registry-scope assessment; no human
      manual-curation claim. Recovered manufacturer-authored BD Difco & BBL Manual,
      second edition 2009, printed p158 (PDF page170), hosted by NMSU. Original capture
      2026-11-08T06:55:09.048187+00:00, SHA256 e5e836a75f13283d477467b20ffc0d332531e0f3a0effb5d64a7147a6985c0b7.
      The approximate per-liter Difco table lists pancreatic digest of casein10g,
      Proteose Peptone No.3 5g, yeast extract5g, beef heart infusion from500g 3g,
      corn starch1g, sodium chloride5g and agar15g; the footnote allows adjustment/supplementation
      to meet performance criteria. It directs suspension of44g powder in1L purified
      water. Those are manufacturer preparation/formula statements, not dry-product
      mass fractions, final yield, or an identified historical JCM lot. The same page
      separately gives BBL42.5g (including13.5g agar, meat peptic digest and heart
      pancreatic digest) and DifcoEH39g (including12g agar and different nutrient
      inputs). The older mirrored manual has different heart wording and BBL proportions
      and is retained as separate version context. The old search wrapper and failed
      official/mirror requests remain historical leads, not primary manual evidence.
