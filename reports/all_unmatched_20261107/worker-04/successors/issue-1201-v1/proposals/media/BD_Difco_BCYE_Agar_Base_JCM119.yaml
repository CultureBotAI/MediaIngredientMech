    notes: MediaDive ingredient1629 usage resolves to JCM119. The primary JCM recipe
      adds37g BD-Difco BCYE agar and, separately,100ml Legionella agar enrichment
      and900ml distilled water. This binds the named BD-Difco dry basal product and
      excludes the separate enrichment; internal formula/catalog remain unasserted.
      It is distinct from ready Eiken alpha plates, Oxoid CYE base/supplement system
      and generic finished BCYE owner. A failed manufacturer insert retrieval does
      not invalidate the exact primary recipe product boundary.
