    source: https://www.jcm.riken.jp/cgi-bin/jcm/jcm_grmd?GRMD=50
    notes: MediaDive ingredient1611 usage links JCM51; JCM51 explicitly references
      ISP-3 oatmeal agar see Medium50 before adding yeast extract. JCM50 prepares
      an oatmeal infusion by heating20g QuakerWhiteOats in1L water and filtering,
      then restoring filtrate to1L and adding1ml trace-salts stock and18g agar. This
      prepared medium differs from the generic existing Oatmeal_Agar family and BD-Difco
      dry-product alias; no vendor product equivalence is asserted. Raw whole oatmeal
      is a processing input, not an unconditional retained20g finished-medium part.
