notes: 'Imported from mim-queue (source_id=mediadive.ingredient:1506); no CAS-RN or
  CHEBI/NCIT match. Reviewed on 2026-05-11 as a prepared chitin substrate form pending
  exact polymer preparation curation. Source-bound 2026-11-08 review: DSMZ1681, one
  of the MediaDive1506 recipe uses, specifies commercial crab (shrimp) shell flakes
  treated with hydrochloric acid, precipitated into cold water, centrifuged and washed
  to pH6-6.5. The recipe lists 5g colloidal chitin and permits commercial chitin powder
  as an alternative. This evidence describes that source protocol only; it does not
  establish that every generic colloidal-chitin source is made by this method, identify
  a single polymer fraction/acetylation state, or promote the owner to CHEBI:17029.
  Full primary capture is retained in the worker04 source-review bundle.'
