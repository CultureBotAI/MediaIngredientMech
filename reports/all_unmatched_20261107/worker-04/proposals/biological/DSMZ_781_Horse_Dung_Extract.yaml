notes: 'DSMZ781 preparation: boil an average-sized piece of horse dung, fresh or frozen,
  in 150 ml water in a water bath for two hours; filter and use immediately. The starting
  dung mass and final extract yield are unspecified. The medium uses 100 ml extract
  with 900 ml distilled water plus other ingredients. Starting dung/water are extraction
  inputs, not asserted molecular constituents of the resulting filtrate, so no has-part
  decomposition is supplied. The current DSMZ PDF does not state separate sterilization;
  the frozen CultureMech note that does so remains a source discrepancy, not an added
  identity property. Raw source label Dung extract is retained here as contextual
  provenance only; no globally resolving generic alias is installed. Proposed payload
  only; no maintained data or release decision changed.'
