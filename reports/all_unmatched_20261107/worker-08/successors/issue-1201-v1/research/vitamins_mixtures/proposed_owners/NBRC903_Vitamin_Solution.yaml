notes: NBRC903 separately prepared vitamin stock. Vitamin B12 0.1 mg, pABA5 mg and
  lipoic acid5 mg per1 L water; generic Ca-pantothenate is preserved. The same literal
  recipe is used by JCM197 trace vitamins, but a D-specific ATCC calcium-pantothenate
  formulation and the current Wolfe stock with KH2PO4 are not established identical.
  Filter sterilize vitamin stock separately before adding to the receiving medium.  Raw
  source labels remain source-scoped in the decisions; no generic label is published
  as a global synonym. Quantified components use the literal preparation batch unless
  explicitly marked MG_PER_L. Component names retain source specificity without inferred
  vitamer, hydrate or stereoisomer IDs. Occurrence counts remain zero pending source-specific
  integration. No roles or downstream hold release is proposed.
