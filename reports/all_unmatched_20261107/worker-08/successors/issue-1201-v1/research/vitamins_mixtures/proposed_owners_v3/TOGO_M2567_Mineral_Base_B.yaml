  carrier, constituents and protocol to identify this preparation while the ambiguous
  token remains unresolved. Complete molecular composition is not asserted. Dissolve
  NTA and use KOH to pH 6.5, then add the minerals and adjust final pH to 7.0 with
  KOH. Filter sterilize stock B before addition to cooled A+D. KOH is retained without
  a quantity; no hydrated CoSO4 is inferred. Literal unresolved source input AIK(SO4)2,
  0.01 g, is retained here but not guessed into a has-part chemical assertion. Raw
  source labels remain source-scoped in the decisions; no generic label is published
  as a global synonym. Quantified components use the literal preparation batch unless
  explicitly marked MG_PER_L. Component names retain source specificity without inferred
  vitamer, hydrate or stereoisomer IDs. Occurrence counts remain zero pending source-specific
  integration. No roles or downstream hold release is proposed.
