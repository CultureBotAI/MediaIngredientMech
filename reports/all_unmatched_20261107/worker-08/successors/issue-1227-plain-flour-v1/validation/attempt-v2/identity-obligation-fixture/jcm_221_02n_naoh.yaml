notes: 'JCM 221 boils and cools 200 ml of 0.2 N NaOH before adding sulfide nonahydrate
  and cysteine hydrochloride monohydrate. Only the NaOH input is represented here;
  downstream solutes and gases are preparation context. Carrier of the NaOH stock
  is unspecified. ATCC 1190/1191 reducing solutions omit cysteine hydration and are
  not asserted as the same whole reducing formulation. Raw case labels remain only
  in evidence and case-bound proposal links, not globally resolving synonyms. No occurrence
  count transfer, source-hold release or receiving-medium dose correction is implied.
  Issue 1227 source-relative completeness: JCM 221 reducing solution uses 200 ml of
  0.2 N NaOH, boils and cools it under N2/H2 before adding sulfide and cysteine. Those
  later inputs are outside the NaOH stock. UNKNOWN denotes unstated source closure;
  no carrier is invented and no particular omitted ingredient is asserted.'
