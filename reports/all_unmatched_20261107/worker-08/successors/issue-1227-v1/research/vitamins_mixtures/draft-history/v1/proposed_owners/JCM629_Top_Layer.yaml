    dependency on vm1201-prop-nbrc903-vitamin, not an already admitted maintained
    owner. Direct JCM197 and NBRC903 tables both enumerate biotin 2 mg, folic acid
    2 mg, pyridoxine-HCl 10 mg, thiamine-HCl/riboflavin/nicotinic acid/calcium pantothenate/pABA/lipoic
    acid 5 mg each, generic B12 0.1 mg and distilled water 1 L. Both filter the vitamin
    stock; no D-specific pantothenate or cyanocobalamin is introduced. The referenced
    candidate already cites both sources. Requires joint integration and independent
    review; frozen Wolfe stock differs. Exact final dependency payload is bound in
    the author dependency ledger.'
