notes: 'Identical enumerated vitamin preparation in NBRC 1020 and NBRC 824. Ten vitamins
  with B12 2.7 mg, biotin0.5 mg and folic acid0.9 mg per 1 L water; differs from the
  common nine-vitamin stock and other starred stocks. NBRC 1020 explicitly filter
  sterilizes the vitamin stock. NBRC 824 does not specify vitamin-stock filtration:
  its receiving-medium instruction dissolves all ingredients except terephthalate,
  sulfide and cysteine before autoclaving. The identical enumeration supports a shared
  input-stock formula only; the receiving-medium processing differs and processed-medium
  equivalence is not asserted.   Raw source labels remain source-scoped in the decisions;
  no generic label is published as a global synonym. Quantified components use the
  literal preparation batch unless explicitly marked MG_PER_L. Component names retain
  source specificity without inferred vitamer, hydrate or stereoisomer IDs. Occurrence
  counts remain zero pending source-specific integration. No roles or downstream hold
  release is proposed.'
