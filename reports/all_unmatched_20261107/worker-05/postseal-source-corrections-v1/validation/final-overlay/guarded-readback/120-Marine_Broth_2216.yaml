component_assertion:
  method: RECIPE_TRANSCRIPTION
  completeness: COMPLETE
  evidence:
  - evidence_type: RECIPE_SOURCE
    source: https://cdn.media.interlabdist.com.br/uploads/2021/01/Marine-2216-Agar-e-Broth.pdf
    notes: The manufacturer manual, printed page 352, labels the Difco Marine Broth
      2216 table "Approximate Formula* Per Liter" and states "Adjusted and/or supplemented
      as required to meet performance criteria." COMPLETE covers all 16 nominal printed
      inputs of the dehydrated product, not exact chemical closure for every lot.
      The listed quantities are per litre at the stated standard reconstitution of
      37.4 g powder in 1 L of purified water; they are not concentrations in the dry
      powder. All component names and quantities are preserved. Generic Peptone and
      source-unspecified salt forms remain UNMAPPED; no unprinted ingredient, lot-specific
      adjustment, hydrate or salt identity is invented. Water is reconstitution solvent,
      not a dry-product constituent. The ATCC agar-minus-agar scratch variant remains
      a distinct formulation.
