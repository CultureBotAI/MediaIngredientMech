  manufacturer casein-derived starting-material description. This does not assign
  bare MediaDive442 or Japanese Polypepton labels to BD211910; those product identities
  remain held. Correct the Polypeptone owner whole-identity boundary with its own
  registry identity and retire the three Hipolypepton resolving aliases using direct
  manufacturer evidence. Preserve other source labels and all ambiguous Japanese Polypepton
  and generic source442 provenance; no forced cross-brand equivalence. Source-qualified
  proposal under issue1193. No ingredient roles, assay outcomes, complete-owner support
  or release admission are approved. Preserve all frozen source and owner holds; component
  uncertainty is stated separately from whole-material identity.


  Final W05 report-only correction: Correct the exact campaign MappingEvidence method
  under issue 1226 to LLM_SUGGESTION; preserve its source and claim. Inherited human/process
  evidence and ComponentEvidence types are unchanged. All original source, organism,
  role, owner and export holds remain. Independent review of these exact successor
  bytes is pending.


  Polypeptone source-origin supplement under issue1202: the two Nihon-qualified Polypepton
  labels are retained as provenance-only REJECTED_LABEL entries. This prevents unsupported
  global resolution; it does not declare every Japanese Polypepton chemically distinct
  from every Hipolypepton. The 2001/2002 Wako and 2007 Nihon primary sources establish
