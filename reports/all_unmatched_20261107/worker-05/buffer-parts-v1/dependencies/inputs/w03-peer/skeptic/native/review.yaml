limitations:
- Complete coverage means every exact component claim received a bounded source disposition;
  it does not mean every original publication or all114 PYG recipes were retrieved
  or read.
- Five generic labels are grounded in literal original dataset fields; underlying
  Bergey chapters/full experimental recipes were not inspected and are not required
  for label-enumeration scope.
- PYGS support is limited to three inspected primary article abstracts; full papers,
  exact digest product and unknown quantities remain unasserted.
- Falsen and Moore original papers were read through captured mirror/web text in specified
  passages; no publisher PDFs were obtained. Moore direct PDF fetch was403HTML; failed
  extraction and missing optional HTML parser dependency are preserved in primary-read-attempts-v1.json.
- Positive E.siraeum peptone support applies only to one PY-cellobiose occurrence.
  The aggregate owner still includes a separately unresolved C.polysaccharolyticum
  occurrence.
- Current DSMZ104c and ATCC1223 recipes are comparators with distinct digest products,
  not source-global proof for historical PY labels.
- Original Fab catalogue/formula, several PY/PYG methods and prior manual chapters
  remain unavailable or unread. Paywall/challenge/timeout evidence is retained honestly;
  no paid provider was used.
- This review makes no claim that peptone is absent from the ten held recipes; it
  withholds the unsupported resolving identity at the present aggregate scope.
- No final consumer candidate was created or accepted. W05 causal generic-peptone
  source case is not an observation of dependent child recipes; authentic origins,
  final exact bytes and independent successor review remain required.
- Generic target acceptance is an application dependency. Missing supplier data is
  not a reason to withdraw a directly supported generic part.
- W03 Marine alias proposal is author-related and not approved here. The W05 product
  withdrawal and composed TARGET-012 remain separate exact proposals; commercial broth
  and ATCC scratch agar-minus-agar formulas are not conflated.
- All whole-owner, role, form, ontology-target and supported/export/release holds
  remain. No current Bacto aliases or registry winner are approved.
- 'Native saver is intentionally not called: user restricts all outputs to the new
  private review subtree. Native YAML/Markdown validation, currentness and virtual
  canonical bundle parsing are performed without writing reviews/structured.'
- 'Review source state is working_tree: private capture hashes are reviewer attestation,
  while exact source proposal Git-blob readbacks are separately recorded. No claim
  that private review files are committed.'
- All scientific flags apply only to bounded claim dispositions; unresolved facts
  and unavailable sources remain explicit. No payload edits or proposal approval occurs.
