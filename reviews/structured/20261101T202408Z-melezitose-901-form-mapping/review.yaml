limitations:
- This is an agent self-review with prior source-analysis participation. Independent
  adversarial review is a separate required subsequent step.
- Only the three mapping claims are reviewed. Empty findings here does not erase the
  two historical major role/whole-record findings or approve CARBON_SOURCE.
- CAS identity was inspected through PubChem database annotations and the actual CultureBotHT
  source row, not through a direct CAS Registry query or new experimental evidence.
- No exact monohydrate term was found in the declared archived exact OLS and pinned
  local ChEBI searches; coverage is bounded and not an assertion of exhaustive or
  future ontology absence.
- CHEBI:6731 is supported as the matching anhydrous form parent; broadMatch is not
  exact identity or subclass_of. CHEBI:183824 is a stereochemical near-miss.
- The generic hydrate CAS 207511-10-2 record remains separate and uncurated here;
  its shared computed chemistry is not merge evidence.
- Source tokens, old validation_method strings and generator confidence values are
  historical/procedural metadata, not fresh scientific approval. The exact original
  KG manifest is preserved to explain the source vocabulary change.
- Source.state=working_tree honestly binds actual inspected bytes in an isolated overlay
  whose durable Git base is e568dbf0e0f759431ed317b973675680f031dd1d. It is a reviewer
  byte attestation, not a claim those changed bytes were committed at that base. The
  producer retains its truthful separate 585b90b4 generation checkpoint.
- No paid research/provider calls were used, and no new biological literature, supplier
  certification or graph-wide validity was assessed.
