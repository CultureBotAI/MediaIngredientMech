  details: 'CID 16217716 is C18H34O17 with exactly one water component. Its non-water
    stereochemical component is CID 92817/CHEBI:6731, C18H32O16. CHEBI:183824 is also
    anhydrous but differs at the InChI stereochemical 10 position and is not a substitute.
    Generic hydrate CAS 207511-10-2 remains a separate record; shared computed chemistry
    does not authorize a merge. The one-water supplied form is related to its anhydrous
    stereochemical component by hydrate-of. Current MAPPING_SEMANTICS explicitly represents
    form-of with skos:broadMatch and requires biolink:broad_match downstream, never
    subclass_of or exact identity. Historical #342 reasoning remains in the record
    as provenance, but its old closeMatch conclusion is superseded by the current
    explicit form-of contract. No ontology ancestry claim is made. All complete row
    fields were inspected. Generated 0.9/0.99 confidence values are mapping heuristics,
    not calibrated scientific probabilities. Historical source tags and validation
    stamps are not promoted to new approval.'
