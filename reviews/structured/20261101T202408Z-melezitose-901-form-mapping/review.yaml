    relation. The inspected monohydrate InChI minus its one water component equals
    both PubChem CID 92817 and active CHEBI:6731 exactly, including stereochemistry.
    MAPPING_SEMANTICS sections 1-3 require NARROW_MATCH to emit skos:broadMatch with
    a B1 handle; this is neither exact parent identity nor an ontology subclass claim.
    The actual parent row publishes no other tokens.
