  quote: "Issues:\n\n\nMajor: a combination antibiotic is modeled as one ingredient:\n\
    `chemical_properties.inchi` and the PubChem response both contain two\ndisconnected\
    \ formula layers, and PubChem names the CAS object as a\nticarcillin/clavulanic-acid\
    \ mixture. The YAML nevertheless sets:\n\n```yaml\ningredient_type: SINGLE_INGREDIENT\n\
    components: null\n```\n\nThat loses the fact that a Timentin dose contributes\
    \ two antimicrobial\nconstituents. The final CAS row is internally consistent,\
    \ but downstream\ncomponent-aware consumers will see a single defined chemical\
    \ rather than a\nmixture.\n\nRecommended Edits:\n- Reclassify the record as a\
    \ mixture or formulation and add reviewed\n  components for ticarcillin and clavulanate,\
    \ using the precise salt/hydration\n  states supported by the source."
