- finding_id: F-K
  issue_key: sssom-builder-cross-record-synonyms
  category: identity
  severity: major
  status: open
  certainty: confirmed
  title: Candidate publishes synonyms owned by distinct records
  description: 'Eleven candidate other fields newly publish another maintained record''s
    name: CuCl2, FeCl2, MgCl2, Na2HPO4 or sea water. These include hydrate/preparation/source-specific
    subjects, so publishing the generic name can erase the distinct subject boundary
    downstream. The native guard confirms the collisions; deciding which source synonym
    or builder enrichment to change requires scoped curation.


    Exact native reject selectors and reasons:

    rows[subject_id="MIM:Cucl2_X_6_H2o", object_id="CHEBI:49553", predicate_id="skos:closeMatch"]:
    Rule K: `other` publishes a name another record owns: ["''CuCl2'' (owned by MIM:Cucl2)"].
    kg-microbe merges `other` into the synonym set, so both records would answer to
    it. Rebuild the SSSOM in claw after fixing the record''s synonyms, or add the
    pair to mappings/other_cross_record_baseline.tsv with a disposition (#669).

