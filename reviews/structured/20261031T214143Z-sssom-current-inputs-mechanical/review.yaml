findings:
- finding_id: F-B5
  issue_key: sssom-builder-dual-local-namespace
  category: identity
  severity: major
  status: open
  certainty: confirmed
  title: Builder adds a second incompatible registry identity
  description: 'The raw builder emits 28 exact-match registry rows across 14 subjects
    using both kgmicrobe.ingredient and kgmicrobe.compound for the same slug. Maintained
    primary identifiers already exist; the inspected B1 backfill separately derives
    compound from the parent ontology prefix and only checks for that exact generated
    CURIE. This conflicts with native B5 and can collapse prepared or source-qualified
    ingredients into a compound identity.


    Exact native reject selectors and reasons:

    rows[subject_id="MIM:84_GL_NaHCO3_Solution", object_id="kgmicrobe.ingredient:84_gl_nahco3_solution",
    predicate_id="skos:exactMatch"]: Rule B5: MIM:84_GL_NaHCO3_Solution exact-matches
    both local registry namespaces for slug 84_gl_nahco3_solution: kgmicrobe.compound:84_gl_nahco3_solution,
    kgmicrobe.ingredient:84_gl_nahco3_solution. kgmicrobe.ingredient and kgmicrobe.compound
    distinguish prepared ingredients from compounds; pick the namespace that matches
    the curated ingredient_type and remove the other identity row.

