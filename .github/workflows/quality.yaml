name: Python quality gate

on:
  pull_request:
    paths:
      - "src/mediaingredientmech/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - ".github/workflows/quality.yaml"
  push:
    branches: [main]
    paths:
      - "src/mediaingredientmech/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - ".github/workflows/quality.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v3

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked development environment
        run: uv sync --frozen --extra dev

      - name: Run the advertised quality gate
        run: just check
