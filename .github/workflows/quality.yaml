name: Python quality gate

# Required checks must report for every PR and merge queue candidate.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
    - main
    paths:
    - src/mediaingredientmech/**/*.py
    - tests/**/*.py
    - pyproject.toml
    - uv.lock
    - .python-version
    - justfile
    - .github/workflows/quality.yaml
  workflow_dispatch:

permissions:
  contents: read

# Keep uv commands on the fleet runtime, including --no-project invocations.
env:
  UV_PYTHON: "3.13"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v3

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install locked development environment
        run: uv sync --frozen --extra dev

      # tests.yaml owns the full pytest suite and its coverage floor.
      - name: Run static quality checks
        run: just lint format-check typecheck
