name: QC — flat export coverage

# Required checks must report for every PR and merge queue candidate.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
    - main
    paths:
    - data/curated/mapped_ingredients.yaml
    - data/curated/unmapped_ingredients.yaml
    - docs/data/all_ingredients.csv
    - scripts/export_lists.py
    - scripts/browser_export.py
    - docs/data/ingredients.json
    - docs/data/label_index.csv
    - scripts/check_flat_export_coverage.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    name: qc-flat-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MIM
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The freshness half runs export_lists.py, so this needs the exporter's
      # own deps — click and rich as well as PyYAML. The public-site build also
      # renders the schema using LinkML runtime (same range as pyproject.toml).
      # Still no OAK, ontology build or claw checkout, so it runs standalone rather than behind
      # `just qc`, which needs all three.
      - name: Install deps
        run: python3 -m pip install pyyaml click rich jinja2 'linkml-runtime>=1.7.0,<1.10'

      - name: Check every curated label is published
        run: python3 scripts/check_flat_export_coverage.py

      - name: Build and verify all public ingredient pages
        run: python3 scripts/build_pages_site.py --output "${RUNNER_TEMP}/mim-site"
