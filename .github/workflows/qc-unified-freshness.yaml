name: QC — unified snapshot freshness

# Required checks must report for every PR and merge queue candidate.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
    - main
    paths:
    - data/ingredients/**
    - UNIFIED_INGREDIENT_MAPPING.tsv
    - UNIFIED_INGREDIENT_MAPPING.provenance.json
    - scripts/check_unified_freshness.py
    - scripts/check_unified_rejections.py
    - mappings/unified_mapping_rejections.tsv
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    name: qc-unified-freshness
    runs-on: ubuntu-latest
    steps:
      # Full history: drift is measured as record files changed since the
      # stamped rev, which a shallow clone cannot answer (#654).
      - name: Checkout MIM
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The identity-only exception replays its exact YAML preimages.
      # Rebuilding still remains a separate local operation (#359).
      - name: Install the offline proof parser
        run: python3 -m pip install pyyaml
      - name: Check the unified snapshot is current with data/ingredients
        run: python3 scripts/check_unified_freshness.py --check

      - name: Check reviewed identity rejections
        run: python3 scripts/check_unified_rejections.py
