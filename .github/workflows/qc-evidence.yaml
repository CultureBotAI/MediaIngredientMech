name: QC — evidence reference validation

# Required checks must report for every PR and merge queue candidate.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
    - main
    paths:
    - data/ingredients/**/*.yaml
    - references_cache/**
    - scripts/run_shared_evidence_validator.py
    - justfile
    - pyproject.toml
    - uv.lock
    - .python-version
  workflow_dispatch:

permissions:
  contents: read

# Keep uv commands on the fleet runtime, including --no-project invocations.
env:
  UV_PYTHON: "3.13"

jobs:
  qc:
    name: qc-evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MIM
        uses: actions/checkout@v4
        with:
          path: MediaIngredientMech

      - name: Checkout claw (for validator)
        uses: actions/checkout@v4
        with:
          repository: CultureBotAI/culturebotai-claw
          # Reviewed validator code; keep aligned with scripts/.vendored_canon_ref.
          ref: c8b8f89ecf29574d7e24f6c65cfd925aefbdd007
          path: culturebotai-claw
          # No token. culturebotai-claw is PUBLIC, so the default GITHUB_TOKEN
          # reads it fine. It was private when this job was written, which is why
          # it used a fine-grained PAT (CLAW_READ_TOKEN) — and that PAT then
          # expired on 2026-08-14, failing this job at checkout with "Bad
          # credentials" on every PR, pointing at the claw repo rather than at
          # the token. Rotating it would have restored the same 90-day fuse.
          # See #367. If claw ever goes private again, restore
          # `token: ${{ secrets.CLAW_READ_TOKEN }}` with a fresh PAT.

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python and locked dependencies
        working-directory: MediaIngredientMech
        run: |
          uv python install 3.13
          uv sync --frozen

      - name: Validate evidence references
        env:
          CLAW_ROOT: ${{ github.workspace }}/culturebotai-claw
        working-directory: MediaIngredientMech
        run: |
          uv run --frozen python scripts/run_shared_evidence_validator.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-validation-${{ github.run_id }}
          path: |
            MediaIngredientMech/workspace/reports/evidence_reference_validation.tsv
            MediaIngredientMech/workspace/reports/evidence_reference_validation.md
          if-no-files-found: warn
