name: QC — evidence reference validation

on:
  pull_request:
    # NO branches filter. A PR whose base is not `main` — every stacked PR —
    # would otherwise skip this gate entirely, so the more carefully work is
    # split into reviewable PRs the less CI it gets (#174). `push` below stays
    # pinned to main, so this does not double-run on feature-branch pushes.
    paths:
      - "data/ingredients/**/*.yaml"
      - "references_cache/**"
      - "src/mediaingredientmech/schema/mediaingredientmech.yaml"
  push:
    branches: [main]
    paths:
      - "data/ingredients/**/*.yaml"
      - "references_cache/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MIM
        uses: actions/checkout@v4
        with:
          path: MediaIngredientMech

      - name: Checkout claw (for validator)
        uses: actions/checkout@v4
        with:
          repository: CultureBotAI/culturebotai-claw
          path: culturebotai-claw
          # No token. culturebotai-claw is PUBLIC, so the default GITHUB_TOKEN
          # reads it fine. It was private when this job was written, which is why
          # it used a fine-grained PAT (CLAW_READ_TOKEN) — and that PAT then
          # expired on 2026-08-14, failing this job at checkout with "Bad
          # credentials" on every PR, pointing at the claw repo rather than at
          # the token. Rotating it would have restored the same 90-day fuse.
          # See #367. If claw ever goes private again, restore
          # `token: ${{ secrets.CLAW_READ_TOKEN }}` with a fresh PAT.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Validate evidence references
        env:
          MEDIAINGREDIENTMECH_ROOT: ${{ github.workspace }}/MediaIngredientMech
        run: |
          cd culturebotai-claw
          python3 scripts/validate_evidence_references.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-validation-${{ github.run_id }}
          path: |
            culturebotai-claw/workspace/reports/evidence_reference_validation.tsv
            culturebotai-claw/workspace/reports/evidence_reference_validation.md
          if-no-files-found: warn
