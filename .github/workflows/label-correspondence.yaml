name: label-correspondence

# Phase 2 (BLOCKING): enforce id↔label correspondence. `just validate-products`
# (Engine B) is a single-pass gate over the curated YAML source (strict
# canonical) and the data products consumed by KG-Microbe (the SSSOM + docs CSV,
# canonical-or-synonym). It fails the build (exit 2) on any MISMATCH /
# ID_NOT_FOUND / structural error. Curator-accepted residuals (e.g. valid MeSH
# supplementary-concept records absent from the cached mesh.db) are declared in
# conf/id_label_targets.yaml `exceptions` and pass as OK_EXCEPTION.
#
# Engine A (`just validate-terms-all`, linkml-term-validator --labels) is NOT a
# CI gate: it spawns one validator process per record (~2k+), which is too slow
# for CI, and Engine B already covers the same YAML ontology_label checks (and
# more — ID_NOT_FOUND, products). It remains a local LinkML-native cross-check.

on:
  pull_request:
    paths: &trigger_paths
      - "data/ingredients/**"
      - "data/curated/**"
      - "mappings/**"
      - "docs/data/**"
      - "src/mediaingredientmech/schema/**"
      - "scripts/validate_id_label_correspondence.py"
      - "conf/id_label_targets.yaml"
      # The gate resolves ontology terms through oaklib, so a dependency change
      # is one of the few things that can alter its verdict without touching any
      # data. Omitting these meant the oaklib 0.6.23 -> 0.7.4 bump in #488 could
      # not trigger the workflow most likely to catch it (#495). Every other
      # library-dependent gate here already lists them.
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/label-correspondence.yaml"
  push:
    branches: [main]
    paths: *trigger_paths
  workflow_dispatch:

permissions:
  contents: read

# The vendored-sync job used to live here and inherited the `paths:` filter
# above, which is scoped to this workflow's expensive OAK-backed gate. That
# filter listed only 2 of the 6 files governed at the time, so the guard almost
# never fired (CultureBotAI/TraitMech#198). It now has its own unfiltered
# workflow, reads all 14 applicable artifacts from claw's pinned manifest, and
# uses only a thin Bash launcher plus Python's standard library. The filter
# above is correct for THIS job, which needs uv + a cached OAK ontology download.

# This job's body now lives in claw as a reusable workflow (culturebotai-claw
# #180, Phase 5). TraitMech was the canary and its run passed on main on
# 2026-08-31, so the workflow is proven rather than merely written; this is the
# second adopter. What stays here is what is MediaIngredientMech's: the trigger
# filter above and the inputs below.
jobs:
  id-label-gate:
    # Pinned to a claw commit, not a branch: a moving ref would change this
    # gate with no commit in this repository to show for it. This is the exact
    # ref TraitMech's passing run used.
    uses: CultureBotAI/culturebotai-claw/.github/workflows/label-correspondence-reusable.yaml@5de472d13e20f02ac494878939ba1cae26468a07
    with:
      python-version: "3.12"
      # No prepare-recipe: the SSSOM and docs CSV this gate reads are
      # committed, so there is nothing to build first. CultureMech differs.
      #
      # `--frozen` is not a default in the reusable workflow, and dropping it
      # here would let CI update the lockfile -- a hardening this repository
      # has and TraitMech does not.
      uv-sync-args: "--frozen"
      # report-label-drift / validate-products / reports/label_drift.tsv are
      # the reusable workflow's defaults and match what ran here before, so
      # they are left unstated rather than restated.
