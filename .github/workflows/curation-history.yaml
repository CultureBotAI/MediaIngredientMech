name: Curation history

# Two-part check, deliberately asymmetric (see history/README.md):
#
#   * VALIDITY is blocking. A malformed history record fails like any other
#     validation error.
#   * PRESENCE is advisory. If an ingredient record changes without a matching
#     history record, this warns in the job summary and passes. A hard gate on
#     provenance blocks legitimate work at inconvenient moments and trains people
#     to route around it — and MIM's bulk imports touch hundreds of records in a
#     single commit.
#
# Validation uses the VENDORED schema at
# src/mediaingredientmech/schema/history.yaml, so this job has no dependency on
# a culturebotai-claw checkout. Only the `just new-history` scaffolder
# needs claw, and that is a dev-time tool.

# Required checks must report for every PR and merge queue candidate.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
    - main
    paths:
    - data/ingredients/**
    - data/curated/**
    - data/custom/**
    - mappings/**
    - history/**
    - src/mediaingredientmech/schema/history.yaml
    - .github/workflows/curation-history.yaml
    - conf/curation_targets.txt
    - scripts/check_curation_targets.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Keep uv commands on the fleet runtime, including --no-project invocations.
env:
  UV_PYTHON: "3.13"

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the merge base to diff against

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Before `Install uv`: this gate needs only the stdlib and git, so a
      # dependency-install failure must not mask it.
      - name: Assert curation-target pathspecs still match something (blocking)
        run: python3 scripts/check_curation_targets.py

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true


      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate history records (blocking)
        run: |
          set -euo pipefail
          if [ ! -d history ] || [ -z "$(find history -name '*.yaml' -print -quit)" ]; then
            echo "No history records to validate."
            exit 0
          fi
          find history -name '*.yaml' -print0 \
            | xargs -0 uv run linkml-validate \
                --schema src/mediaingredientmech/schema/history.yaml \
                --target-class HistoryRecord

      - name: Check for missing history records (advisory)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"

          # The pathspecs come from conf/curation_targets.txt, which the
          # check-curation-targets gate also reads — so the list this counts and
          # the list something asserts cannot drift apart. That mattered:
          # `data/custom/*.yaml` matched zero tracked files for its whole life
          # because that directory holds a .tsv, and because this step COUNTS
          # rather than asserts, it contributed 0 and read exactly like "no
          # records changed" (#180, #181).
          # `eval set --` expands the quoted spec list into "$@" and nothing else.
          # Interpolating $base into an eval string would re-expand it: git allows
          # `$`, backticks and `(` in refnames, so a branch named `rel/$v2` would
          # be re-parsed on that second pass (under `set -u`, a hard failure).
          specs=$(python3 scripts/check_curation_targets.py --print-specs --role targets)
          eval "set -- $specs"
          changed_targets=$(git diff --name-only "$base"...HEAD -- "$@" | wc -l | tr -d ' ')

          # Also from the shared list, under the `history` role. An earlier draft
          # kept this inline, arguing a dead spec here would warn on every PR and
          # so fail loudly. That was weak: a permanently-warning advisory is noise
          # that gets tuned out, which this workflow's own header calls out as
          # training people to route around the check.
          eval "set -- $(python3 scripts/check_curation_targets.py --print-specs --role history)"
          new_history=$(git diff --name-only --diff-filter=A "$base"...HEAD -- "$@" | wc -l | tr -d ' ')

          {
            echo "## Curation history"
            echo
            echo "- curation targets changed: **$changed_targets**"
            echo "- history records added: **$new_history**"
            echo
            if [ "$changed_targets" -gt 0 ] && [ "$new_history" -eq 0 ]; then
              echo "> [!WARNING]"
              echo "> This PR changes ingredient records or mappings but adds no"
              echo "> history record."
              echo "> Scaffold one with \`just new-history\` — see \`history/README.md\`."
              echo ">"
              echo "> Advisory only; this does not block the build."
            elif [ "$changed_targets" -gt 0 ]; then
              echo "Provenance recorded for this change."
            else
              echo "No curation targets changed; nothing to record."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
