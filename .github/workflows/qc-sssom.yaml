name: QC — SSSOM invariant validation

on:
  pull_request:
    # NO branches filter. A PR whose base is not `main` — every stacked PR —
    # would otherwise skip this gate entirely, so the more carefully work is
    # split into reviewable PRs the less CI it gets (#174). `push` below stays
    # pinned to main, so this does not double-run on feature-branch pushes.
    paths:
      - "mappings/ingredient_mappings.sssom.tsv"
      - "mappings/needs_curator_review.tsv"
      - "scripts/validate_sssom_invariants.py"
      - "scripts/validate_published_curies.py"
      - "scripts/reconcile_sssom.py"
      - "data/curated/mapped_ingredients.yaml"
  push:
    branches: [main]
    paths:
      - "mappings/ingredient_mappings.sssom.tsv"
      - "mappings/needs_curator_review.tsv"
      - "scripts/validate_sssom_invariants.py"
      - "scripts/validate_published_curies.py"
      - "scripts/reconcile_sssom.py"
      - "data/curated/mapped_ingredients.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MIM
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: python3 -m pip install pyyaml

      - name: Validate published CURIEs
        run: python3 scripts/validate_published_curies.py

      - name: Validate SSSOM invariants (Rule A)
        run: python3 scripts/validate_sssom_invariants.py

      - name: Check SSSOM currency vs curated data
        run: python3 scripts/reconcile_sssom.py

      - name: Upload triage TSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: needs-curator-review-${{ github.run_id }}
          path: mappings/needs_curator_review.tsv
          if-no-files-found: warn
