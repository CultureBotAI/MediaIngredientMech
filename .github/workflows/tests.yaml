name: Tests (pytest)

# Runs the pytest suite (500+ tests, fully hermetic — OAK and HTTP are mocked, no
# network or large ontology DBs needed) so the guard tests added across the role /
# SSSOM / occurrence-stats work actually fail PRs on regression, instead of only
# running locally. Complements the data/schema QC workflows (validate-strict,
# qc-sssom, qc-evidence) which don't run pytest.

# Required checks must report for every PR and merge queue candidate.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read

# Keep uv commands on the fleet runtime, including --no-project invocations.
env:
  UV_PYTHON: "3.13"
  RECORD_REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || (github.event_name == 'workflow_dispatch' && 'HEAD') || 'INVALID-REVIEW-BASE' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Native adoption fixtures capture real transaction/lease source files.
      # Reuse the existing immutable pin without installing Claw or its providers.
      - name: Read immutable native Claw revision
        id: native-claw-pin
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import os
          import re
          from pathlib import Path

          pin_path = Path("scripts/.vendored_canon_ref")
          if pin_path.is_symlink() or not pin_path.is_file():
              raise SystemExit("Canonical pin must be a regular, non-symlink file")
          with pin_path.open("rb") as stream:
              pin = stream.read(64)
          if re.fullmatch(rb"[0-9a-f]{40}\n?", pin) is None:
              raise SystemExit("Canonical pin must contain one full lowercase commit SHA")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("ref=" + pin.decode("ascii").strip() + "\n")
          PY

      - name: Checkout pinned native Claw fixture source
        uses: actions/checkout@v4
        with:
          repository: CultureBotAI/culturebotai-claw
          ref: ${{ steps.native-claw-pin.outputs.ref }}
          path: .temp/native-claw
          persist-credentials: false

      # The worktree recipe regression test needs the real just executable.
      - uses: extractions/setup-just@v3

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install runtime dependencies
        # --frozen fails if uv.lock is stale (no silent re-resolve in CI). Runtime
        # deps only; pytest/pytest-cov are layered via `uv run --with` below so the
        # heavy py>=3.12 dev extras (edison-client / deep-research-client) aren't
        # pulled for a hermetic unit-test run.
        run: uv sync --frozen

      - name: Validate structured record reviews
        run: just test-record-reviews

      - name: Run pytest
        env:
          CLAW_SRC: ${{ github.workspace }}/.temp/native-claw/src
        run: uv run --with pytest --with pytest-cov pytest

      - name: Enforce maintained-package coverage
        run: uv run --with coverage coverage report --include='src/mediaingredientmech/*' --fail-under=35

      - name: Report legacy-script coverage
        run: uv run --with coverage coverage report --include='scripts/*'
