name: QC — collection/per-record round-trip

# Asserts that data/curated/ and data/ingredients/ still describe the same
# records, so an edit made directly to a per-record file cannot be silently
# reverted by the next `just export-individual` (which projects the collection
# over the per-record tree, and which promote_resolved_unmapped.py calls).
#
# This is the guard that was missing: scripts/verify_roundtrip.py already
# existed, but it compared against the committed data/collections/ artifact,
# last regenerated in March 2026 — so it kept passing while 55 curation events
# from PR #116 sat unreconciled in the per-record files. This job aggregates
# into a temp directory instead, so it can never compare against a stale copy.

on:
  pull_request:
    # NO branches filter. A PR whose base is not `main` — every stacked PR —
    # would otherwise skip this gate entirely, so the more carefully work is
    # split into reviewable PRs the less CI it gets (#174). `push` below stays
    # pinned to main, so this does not double-run on feature-branch pushes.
    paths:
      - "data/curated/**"
      - "data/ingredients/**"
      - "scripts/aggregate_records.py"
      - "scripts/verify_roundtrip.py"
      - "scripts/export_individual_records.py"
      - "scripts/check_record_filename_case.py"
      # The no-op assertion below compares emitted bytes, and save_yaml decides
      # those bytes. A PR changing only its dump kwargs would otherwise skip
      # this gate and land, after which every export diffs the whole corpus.
      - "src/mediaingredientmech/utils/yaml_handler.py"
      - "uv.lock"
      - ".github/workflows/qc-roundtrip.yaml"
  push:
    branches: [main]
    paths:
      - "data/curated/**"
      - "data/ingredients/**"
      - "scripts/aggregate_records.py"
      - "scripts/verify_roundtrip.py"
      - "scripts/export_individual_records.py"
      - "scripts/check_record_filename_case.py"
      # The no-op assertion below compares emitted bytes, and save_yaml decides
      # those bytes. A PR changing only its dump kwargs would otherwise skip
      # this gate and land, after which every export diffs the whole corpus.
      - "src/mediaingredientmech/utils/yaml_handler.py"
      - "uv.lock"
      - ".github/workflows/qc-roundtrip.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MIM
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # `uv sync --frozen`, not `pip install pyyaml`, because the final step
        # asserts BYTE-EXACT YAML emission across 2,257 files. An unpinned
        # PyYAML that changes Emitter line-wrapping would turn the whole corpus
        # red with zero data change. uv.lock pins the emitter.
        run: uv sync --frozen

      # Runs BEFORE the export steps, on the tree as committed. A record file
      # whose name drifts in case only is invisible to `git status` on macOS —
      # where most curation happens — and only materialises here, as a second
      # file for one record. It surfaced three times as a confusing failure in
      # some *other* artifact (a stale ingredients.json, an apparent lost
      # record) rather than as the rename it actually was. Issue #352.
      - name: Check per-record filenames match what git tracks (case-exact)
        run: python3 scripts/check_record_filename_case.py

      - name: Aggregate per-record files to a temp collection
        run: |
          uv run python scripts/aggregate_records.py \
            --ingredients-dir data/ingredients \
            --output-dir "${RUNNER_TEMP}/agg"

      - name: Verify curated <-> per-record round trip
        run: |
          uv run python scripts/verify_roundtrip.py \
            --original-dir data/curated \
            --aggregated-dir "${RUNNER_TEMP}/agg"

      # #380. generate_index_files.py writes nine published artifacts under
      # data/curated/ and was reachable from no recipe and no CI job, so it ran
      # only when a curator remembered. It had already gone stale, still
      # advertising `UNMAPPED_0434 | Marine broth 2216` after that record was
      # promoted. A recipe alone does not fix that — #217 added one for
      # export-lists and this is the same defect a second time — so assert the
      # regeneration is a NO-OP, which is what makes staleness fail loudly
      # instead of accumulating. The script is idempotent and writes no
      # timestamps, so a diff here means the artifacts are genuinely behind.
      - name: Assert the curated indexes are current
        run: |
          uv run python scripts/generate_index_files.py
          if [ -n "$(git status --porcelain -- data/curated)" ]; then
            echo "::error::data/curated indexes are stale — run 'just export-indexes' and commit the result."
            git status --porcelain -- data/curated
            git diff --stat -- data/curated
            exit 1
          fi
          echo "curated indexes are current."

      - name: Assert export is a no-op (per-record tree matches the collection)
        run: |
          uv run python scripts/export_individual_records.py \
            --input-dir data/curated --output-dir data/ingredients
          if [ -n "$(git status --porcelain -- data/ingredients)" ]; then
            echo "::error::export-individual changed data/ingredients — the per-record tree is not a clean projection of data/curated/. If a script edited data/ingredients/ directly (apply-role-research-results does), run 'just sync-curated' to write those edits back into data/curated/ and commit the result. Do NOT run 'just sync-individual' — it exports first, overwriting the per-record edits."
            git status --porcelain -- data/ingredients
            git diff --stat -- data/ingredients
            exit 1
          fi
          echo "export-individual is a no-op — round trip is closed."
