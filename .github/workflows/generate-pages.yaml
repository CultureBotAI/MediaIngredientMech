name: Deploy GitHub Pages

# Build catalog and per-ingredient pages from current YAML before publication.
# docs/ supplies the landing/browser/maps; generated records live under records/.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "data/ingredients/**"
      - "src/mediaingredientmech/**"
      - "scripts/browser_export.py"
      - "scripts/build_pages_site.py"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/generate-pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install locked build dependencies
        run: uv sync --frozen --python 3.13

      - name: Build and verify complete ingredient site
        run: uv run python scripts/build_pages_site.py --output site


      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload verified site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
