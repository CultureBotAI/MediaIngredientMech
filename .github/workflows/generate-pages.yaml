name: Deploy GitHub Pages

# Publishes MIM's static site (the committed `docs/` web root: landing page,
# ingredient browser, ingredient UMAP, and their JSON data) to GitHub Pages
# via the Actions deploy path. `docs/` is authored/committed in-repo (the
# landing + browser + umap are static; per-ingredient detail pages are a
# separate artifact build). The site is served verbatim (no Jekyll).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "data/ingredients/mapped/**"
      - "data/ingredients/unmapped/**"
      - "src/mediaingredientmech/synonym_policy.py"
      - "data/text_map/**"
      - "conf/text_map.yaml"
      - "src/mediaingredientmech/text_map_*.py"
      - "scripts/check_graph_receipts.py"
      - "src/mediaingredientmech/graph_embedding_receipts.py"
      - "scripts/stage_text_map.py"
      - "scripts/embedding_pipeline.py"
      - ".github/workflows/generate-pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for map validation
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Validate both graph maps against the complete current corpus
        run: python scripts/check_graph_receipts.py

      - name: Disable Jekyll (serve docs/ as static)
        run: touch docs/.nojekyll

      - name: Validate and stage the configured semantic text map
        run: |
          python -m pip install --quiet pyyaml
          python scripts/stage_text_map.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload docs/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
