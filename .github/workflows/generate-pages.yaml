name: Deploy GitHub Pages

# Build catalog and per-ingredient pages from current YAML before publication.
# docs/ supplies the landing/browser/maps; generated records live under records/.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "data/ingredients/**"
      - "data/ingredients/mapped/**"
      - "data/ingredients/unmapped/**"
      - "src/mediaingredientmech/**"
      - "src/mediaingredientmech/synonym_policy.py"
      - "data/text_map/**"
      - "conf/text_map.yaml"
      - "src/mediaingredientmech/text_map_*.py"
      - "scripts/browser_export.py"
      - "scripts/build_pages_site.py"
      - "scripts/check_graph_receipts.py"
      - "src/mediaingredientmech/graph_embedding_receipts.py"
      - "scripts/stage_text_map.py"
      - "scripts/embedding_pipeline.py"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/generate-pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PAGES_ALLOW_STALE_CORPUS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install locked build dependencies
        run: uv sync --frozen --python 3.13

      - name: Set up Python for map validation
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Validate both graph maps against the complete current corpus
        run: python scripts/check_graph_receipts.py

      - name: Validate and stage the configured semantic text map
        run: |
          python -m pip install --quiet pyyaml
          python scripts/stage_text_map.py

      - name: Build and verify complete ingredient site
        run: uv run python scripts/build_pages_site.py --output site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload verified site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
