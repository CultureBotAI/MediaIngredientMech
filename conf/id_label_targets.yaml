# Targets for scripts/validate_id_label_correspondence.py (Engine B).
#
# Declares which surfaces carry ontology (id, label) pairs and how strictly
# the label must correspond to the id's ontology label.
#
# A CURIE prefix is handled three ways:
#   * in `adapters`          → looked up against that OAK ontology.
#   * in `ignored_prefixes`  → legitimate non-ontology id (cas:, MIM:, …);
#                              SKIPPED_NO_ADAPTER, never looked up.
#   * neither                → UNKNOWN_PREFIX (ERROR) — a typo (CHBEI:) or an
#                              unexpected new prefix that must be triaged (added
#                              to `adapters` or `ignored_prefixes`) rather than
#                              silently passing the gate. Ids with NO prefix at
#                              all (UNMAPPED_0001) are a benign skip.
#
# Policy:
#   canonical            label must equal the canonical OBO label (mirrors the
#                        linkml-term-validator schema gate; used for YAML data).
#   canonical_or_synonym label may be the canonical label OR a synonym within
#                        `synonym_scope` (used for product/surface labels).
# synonym_scope: exact | exact_related | all   (exact_related = +hasRelatedSynonym)

adapters:
  CHEBI: sqlite:obo:chebi
  FOODON: sqlite:obo:foodon
  NCIT: sqlite:obo:ncit
  MESH: sqlite:obo:mesh
  UBERON: sqlite:obo:uberon
  ENVO: sqlite:obo:envo
  BTO: sqlite:obo:bto
  PATO: sqlite:obo:pato
  # MICRO is intentionally NOT an adapter here: sqlite:obo:micro is a 0-byte
  # stub with no remote db, so handing OAK a MICRO: id triggers a futile S3
  # download that errors (ADAPTER_ERROR, fatal under enforce) on a cold CI
  # cache. This mirrors Engine A, which omits MICRO from `obo_prefixes` in the
  # justfile. MICRO ids are therefore an explicit `ignored_prefixes` skip
  # (SKIPPED_NO_ADAPTER, no download) — move MICRO back here once a real
  # micro.db exists so its labels can actually be validated.

# Legitimate NON-ontology id prefixes — skipped without a lookup, but
# acknowledged so a typoed ontology prefix (CHBEI:, CHEB:) is NOT mistaken for
# one of these and instead fails as UNKNOWN_PREFIX. Keep in sync with the
# prefixes actually emitted by the curation/import pipelines.
ignored_prefixes:
  - MIM                    # MediaIngredientMech-local record ids
  - MICRO                  # sqlite:obo:micro is a 0-byte stub w/ no remote db (see adapters note)
  - cas                    # CAS registry numbers
  - registry               # generic registry fallback
  - kgmicrobe.compound     # KG-Microbe compound nodes
  - kgmicrobe.ingredient   # KG-Microbe ingredient nodes
  - mediadive.ingredient   # MediaDive ingredient nodes
  - mediadive.solution     # MediaDive solution nodes
  - mediadive.compound     # MediaDive compound nodes

synonym_scope: exact_related

# Severity of IMPLAUSIBLE_LABEL (from `label_waiver_mode: plausible`). Shipped as
# `warn` for the report-then-enforce rollout the base gate used; flipped to
# `error` on 2026-07-30 once that backlog reached zero (OK_CANONICAL 5034 /
# OK_ID_ONLY 1667 / OK_EXCEPTION 16 / IMPLAUSIBLE_LABEL 0). An implausible
# id<->label pair now fails `just validate-products` instead of only reporting.
#
# CAVEAT (#261): that IMPLAUSIBLE_LABEL 0 was measured against a surface where
# the checked label IS the term's own canonical label, so it recorded the gate
# short-circuiting rather than the data being clean. The curator-label surface
# (mapped_csv_curator_label) carries the real backlog and is held at
# `severity: warn` until it is worked down. This global stays `error` — it is
# load-bearing for every surface that genuinely passes.
plausibility_severity: error

# Numeric accession ceiling per ontology. An id that does NOT resolve AND sits
# above the ceiling is a foreign identifier wearing an OBO prefix (a PubChem CID
# under a CHEBI: prefix) rather than a retired accession -- its own verdict.
max_accession:
  CHEBI: 300000
  FOODON: 4000000
  UBERON: 9000000
  ENVO: 9000000
  NCIT: 900000

# Curator-accepted residuals shared across every surface that carries them.
# These four are VALID MeSH supplementary-concept records (verified live in MeSH:
# avocatin B introduced 2020, sodium glutarate 2024) with no CHEBI equivalent. The
# cached sqlite:obo:mesh adapter predates these SCRs, so they resolve as
# ID_NOT_FOUND even though the data is correct. Listing the exact (id, label) pair
# accepts it as OK_EXCEPTION (non-error) so the gate can be enforced/blocking. The
# match is exact: a *different* label on the same id still fails. Remove an entry
# once mesh.db includes that SCR.
mesh_scr_exceptions: &mesh_scr_exceptions
  - {id: mesh:C000709627, label: avocatin B, reason: "valid MeSH SCR (2020); absent from cached sqlite:obo:mesh; no CHEBI equivalent"}
  - {id: mesh:C000655964, label: cholinium lysinate, reason: "valid MeSH SCR; absent from cached sqlite:obo:mesh; no CHEBI equivalent"}
  - {id: mesh:C000730144, label: sodium glutarate, reason: "valid MeSH SCR (2024); absent from cached sqlite:obo:mesh; no CHEBI equivalent"}
  # Same accepted residual, as the CURATOR writes it. The allow-list matches an
  # EXACT (id, label) pair, so gating preferred_term (#261) needs that surface's
  # label form too — without it the id reports ID_NOT_FOUND on a record we have
  # already accepted.
  - {id: mesh:C000730144, label: Disodium Glutarate, reason: "curator label form of the mesh:C000730144 residual above"}
  - {id: mesh:C000633628, label: plicacetin, reason: "valid MeSH SCR; absent from cached sqlite:obo:mesh; no CHEBI equivalent"}

targets:
  # --- data inputs / intermediates (YAML) — strict canonical, mirrors Engine A
  - name: curated_yaml
    kind: yaml
    glob:
      - "data/curated/mapped_ingredients.yaml"
      - "data/ingredients/mapped/*.yaml"
      - "data/ingredients/unmapped/*.yaml"
    policy: canonical
    exceptions: *mesh_scr_exceptions
    pairs:
      - [ontology_id, ontology_label]
      - [environment_term, environment_label]

  # --- data products (TSV/CSV) — canonical OR synonym surface form
  # required:true — ingredient_mappings.sssom.tsv is THE canonical MIM mapping
  # artifact; if the build didn't produce it, enforce must FAIL rather than
  # silently green on a missing product (Engine-B zero-match false-green fix).
  - name: sssom
    kind: tabular
    format: tsv
    glob: "mappings/ingredient_mappings.sssom.tsv"
    required: true
    policy: canonical_or_synonym
    exceptions: *mesh_scr_exceptions
    pairs:
      - [subject_id, subject_label]
      - [object_id, object_label]

  # docs/data/mapped_ingredients.csv carries BOTH labels, in two columns:
  #   ontology_label  — the OBO canonical form ("calcium chloride dihydrate")
  #   preferred_term  — the CURATOR-INTENDED recipe name ("CaCl2 x 2 H2O")
  # An earlier PRODUCT DECISION (item 3c) comment here claimed ontology_label
  # held the curator name and cited CHEBI:86158 "CaCl2 x 2 H2O" as the example.
  # The export stopped doing that: 792 of 1902 CHEBI rows now differ between the
  # two columns, and CHEBI:86158's ontology_label is the canonical
  # "calcium chloride dihydrate". Gating only ontology_id/ontology_label made the
  # plausibility check a NO-OP — the label being checked IS the term's own label,
  # so every row short-circuits on "matches the term's own label or a synonym"
  # before the formula comparison runs, and IMPLAUSIBLE_LABEL: 0 measured the
  # gate doing nothing rather than the data being clean (#261).
  - name: mapped_csv
    kind: tabular
    format: csv
    glob: "docs/data/mapped_ingredients.csv"
    policy: canonical_or_synonym
    label_waived_keys:
      - ontology_id
    label_waiver_mode: plausible
    exceptions: *mesh_scr_exceptions
    pairs:
      - [ontology_id, ontology_label]

  # The curator-label surface, where the plausibility gate actually has work to
  # do: a formula label (KH2PO4, CaCl2 x 2 H2O) is accepted only if its element
  # multiset is consistent with the CHEBI term's own formula. This is a SEPARATE
  # target rather than a second `pairs` entry above because severity is per
  # target, and this surface has a real backlog to work down first:
  #
  #   IMPLAUSIBLE_LABEL 50 · HYDRATE_ON_ANHYDROUS_TERM 39
  #   LABEL_SUBSCRIPTS_LOST 3 · HYDRATION_STATE_MISMATCH 2
  #   ANHYDROUS_ON_HYDRATE_TERM 2
  #
  # `severity: warn` reports them without failing `just validate-products`,
  # repeating the report-then-enforce rollout the base gate used. Flip to error
  # once the backlog is triaged (#261) — genuine residuals go on `exceptions`
  # with a documented reason, mis-groundings get re-grounded, and the hydrate
  # findings get MAPPING_SEMANTICS.md Section 3 treatment.
  - name: mapped_csv_curator_label
    kind: tabular
    format: csv
    glob: "docs/data/mapped_ingredients.csv"
    policy: canonical_or_synonym
    severity: warn
    label_waived_keys:
      - ontology_id
    label_waiver_mode: plausible
    exceptions: *mesh_scr_exceptions
    pairs:
      - [ontology_id, preferred_term]

  # NOTE: the review TSVs (`mappings/*review*.tsv`) are intentionally NOT gated.
  # They are human/tool WORKING files, not data products: by design they record
  # candidate object_ids under review — including obsolete (CHEBI:8150), invalid
  # (CHEBI:3463/23674) or not-yet-labelled (`None`) ids that a curator is in the
  # process of accepting or rejecting. Enforcing id↔label correspondence on a
  # review scratchpad turns "candidate awaiting triage" into a false ERROR. The
  # id↔label invariant is enforced where it matters: the curated YAML source
  # (strict canonical) and the downstream products consumed by KG-Microbe (the
  # SSSOM + docs CSV). A row only becomes gate-relevant once it is accepted into
  # those surfaces.
