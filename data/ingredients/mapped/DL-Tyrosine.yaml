  evidence:
  - evidence_type: MANUAL_CURATION
    source: MIM curation (#260)
    notes: 'Created to cover a CultureMech label MIM could not resolve (#260): ChEBI
      has no racemic tyrosine term — a search returns only derivatives (DL-tyrosine
      betaine, racemetirosine) — so the stereo-unspecified parent is the closest available,
      which is what the corpus''s other 15 `DL-` records do (DL-aspartic acid->CHEBI:22660,
      DL-methionine->CHEBI:16811). Graded CLOSE_MATCH, not the EXACT those often use:
      the label names a racemate and the term does not distinguish stereochemistry
      at all, so skos:closeMatch is the honest predicate. NOT CHEBI:17895 L-tyrosine,
      which is what CultureMech asserts (CultureMech#276) — that silently discards
      the D-enantiomer.'
