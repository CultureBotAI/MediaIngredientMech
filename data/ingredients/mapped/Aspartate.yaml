    notes: 'Re-grounded CHEBI:132943 -> CHEBI:29995. CHEBI:132943 is the charge-agnostic
      parent whose children are aspartate(2-) and aspartate(1-), so a bare label sitting
      on it declines to state a protonation state. The sibling record Glutamate —
      same amino-acid family, same bare-label form, same import — is on CHEBI:29987
      glutamate(2-), and 30 other bare -ate labels in this corpus are likewise on
      charged terms. Both terms are stereo-agnostic, so no stereochemical claim is
      added; ''aspartate'' is a ChEBI synonym of CHEBI:29995, so the lexical evidence
      survives. Counter-argument on record: MAPPING_SEMANTICS §3 step 4 would keep
      an evidence-free under-specified label on the parent, and Malate (same hierarchy
      shape) does exactly that — §3 does not address protonation, which #319 tracks.'
