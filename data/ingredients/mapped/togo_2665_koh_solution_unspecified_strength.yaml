notes: 'The captured TOGO M2665 record preserves KOH solusion and classifies it as
  potassium hydroxide solution. ATCC 1775 specifies KOH for NTA dissolution at pH
  6.5 and later pH 7.0 adjustment, without defining the supplied KOH form or concentration.
  The bounded TOGO stock records unquantified KOH. Neither source identifies its carrier.
  Approximately 500 ml then 1 L distilled water belongs to the receiving NTA/trace-element
  preparation. Stock solvent identity and grade, strength, titrant amount and preparation
  remain unknown; no molarity, volume, dry hydrate or final neutralization species
  is asserted. Raw labels retained as occurrence provenance only: [''KOH solusion''].'
