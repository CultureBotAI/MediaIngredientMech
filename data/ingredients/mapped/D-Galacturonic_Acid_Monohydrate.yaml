      the anhydrous salt while the label names a hydrate, understating the mass by
      18 g/mol per water. Corrected because the label states 1 water(s) of hydration,
      and the recorded formula was byte-identical to the anhydrous parent CHEBI:18024's
      ChEBI formula ('C6H10O7') — the mark of a value inherited from the parent rather
      than measured for this record. Water appended in ChEBI's own dot-separated notation.
