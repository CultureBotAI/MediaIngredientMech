    source: https://www.dsmz.de/microorganisms/medium/pdf/DSMZ_Medium40.pdf; https://togomedium.org/medium/M2477
    notes: 'The DSMZ40/TOGO M2477 instructions explicitly mix solutions D, C and E
      before adding to solution A. This is a physical combined preparation, not the
      complete marine medium. Its parts remain source-qualified C, D and E preparations;
      provider section volumes are not treated as measured stock aliquots or converted
      into concentrations. The separate salt/receiving-medium variant is not asserted
      as part of this premix. Provider table transcription (quantity basis qualified
      below; not calculated stock concentrations): Provider section volumes C50mL/D450mL/E25mL
      (not measured whole-stock aliquots). No batch-to-final-volume conversion is
      made. Handling atmosphere is not listed as a material part; pH reagents are
      source inputs, without an assertion of unchanged molecular species after pH
      adjustment. Nested formulations remain source-qualified named parts where exact
      composition/owner identity is not established. No verified exact eligible ontology
      term or existing whole-preparation owner was established by the bounded source/owner
      review. This self-registry mapping represents the preparation, not its individual
      constituents. DSMZ40 inherits DSMZ29. In29, C uses50mLwater, D uses450mLwater
      plus0.5mLresazurin solution, and E uses25mLwater plus1mLtrace solution and solutes;
      the prepared C/D/E solutions are combined. TOGO M2477 section volumes50/450/25mL
      are provider group-volume claims, not measured final aliquots of those stocks.
      No final-volume or concentration calculation is asserted.'
