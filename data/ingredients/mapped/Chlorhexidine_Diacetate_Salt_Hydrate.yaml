      https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/206986-79-0/property/Title,MolecularFormula,InChI,InChIKey/JSON;
      https://www.ebi.ac.uk/chebi/backend/api/public/compound/81711/. Captures, exact
      input hashes and scope limits: reports/step7d_mapping_901_20261103/evidence-manifest.json.
      Independent review identifies the existing exact synonym ''N,N''''''''-hexane-1,6-diylbis[N''-(4-chlorophenyl)triimidodicarbonic
      diamide] acetate (1:2)'' as the water-free parent, not this hydrate; preserve
      it as REJECTED_LABEL. This curation adds no scientific, mapping-release or role
      approval; changed owner bytes withdraw inherited support.'
