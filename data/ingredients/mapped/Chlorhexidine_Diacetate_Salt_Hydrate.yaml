  - evidence_type: DATABASE_MATCH
    source: MIM curation (#321/#334)
    notes: identifier CHEBI:81711 -> kgmicrobe.compound:chlorhexidine_diacetate_salt_hydrate;
      mapping_quality EXACT_MATCH -> NARROW_MATCH. The record is a hydrate of CHEBI:81711
      ('chlorhexidine acetate') and was sharing that term's identifier — the identity
      collapse MAPPING_SEMANTICS §3 forbids, which made a distinct substance indistinguishable
      from its anhydrous parent downstream. ChEBI has no term for this hydrate and
      the record carries no verified CAS, so steps 1 and 2 are unavailable and step
      3 applies.
  - evidence_type: DATABASE_MATCH
    source: MIM curation (#342)
    notes: 'mapping_quality NARROW_MATCH -> CLOSE_MATCH, predicate skos:narrowMatch
      -> skos:closeMatch. narrowMatch asserts this record is *narrower in meaning*
      than CHEBI:81711 (''chlorhexidine acetate'') — a subsumption ChEBI itself denies:
      it files hydrates under CHEBI:35505 ''hydrate'', never under the anhydrous compound,
      which is not an ancestor even transitively. A hydrate is a distinct substance
      containing the anhydrous form, not a specialization of it. closeMatch claims
      similarity without subsumption. The ontology_id and the record''s own identifier
      are unchanged.'
  - evidence_type: MANUAL_CURATION
    source: MIM hydrate review (#901)
    notes: Specific hydrate record (Chlorhexidine diacetate salt hydrate, identifier
      kgmicrobe.compound:chlorhexidine_diacetate_salt_hydrate) is narrower than parent
      CHEBI:81711 (chlorhexidine acetate); updated mapping_quality CLOSE_MATCH ->
      NARROW_MATCH (SSSOM skos:broadMatch).
