      diacetate salt hydrate, current formula xH2O. This settles the source-defined
      variable hydrate, not a fixed monohydrate. Retain its local identity distinct
      from water-free CHEBI81711. Use NARROW_MATCH/broadMatch to the diacetate parent.
      Current supplier CAS206986-79-0 yields mixed PubChem forms and does not justify
      any exact CAS or ontology primary promotion. 7b removed dry structures. Historical
      chemical CAS56-95-1 is the water-free parent CAS; move procurement context to
      supplied_form with explicit historical/current disagreement, preserving both
      observations without exact-identity assertion. Primary source references: https://www.sigmaaldrich.com/US/en/product/sigma/c6143;
      https://pubchem.ncbi.nlm.nih.gov/rest/pug/substance/sourceid/Sigma-Aldrich/C6143_SIGMA/JSON;
