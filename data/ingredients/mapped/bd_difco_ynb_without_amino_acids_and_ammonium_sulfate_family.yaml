notes: NBRC113 explicitly names Bacto-Yeast Nitrogen Base w/o Amino Acids and Ammonium
  Sulfate (Difco),1.7g, while adding NH4Cl and amino acids separately. The current
  officialBD233520 page identifies the same double-exclusion family (100g packaging).
  This proposal denotes the manufacturer-qualified basal-mixture family with both
  exclusions, not a retrospective claim that NBRC113 used SKU233520, a specific packaging
  size or an invariant historical lot. It excludes completeYNB, products omitting
  only amino acids, pure ammonium sulfate and the complete methanol medium. Full constituent
  quantities, chemical closure and biological role are not asserted; separate medium
  supplements are not part of this product. The raw source label is preserved here
  as occurrence provenance, not a global synonym for every YNB product.
