  medium_name: gyps_medium
  relationship: SIMILAR_COMPOSITION
  source_path: data/normalized_yaml/bacterial/gyps_medium.yaml
  evidence: Compared source-specific Alain et al. 2002 p.1622 GYPS with CultureMech:002799
    (JCM J449). Both specify glucose 5 g/L, yeast extract 0.5 g/L, peptone 1 g/L and
    sea salts 30 g/L. J449 uses MES 3.9 g/L and pH 6.0; the original uses PIPES 6.05
    g/L, sulfur 12 g/L and pH 7.5 plus reducing agent and redox indicator. This substantiates
    composition similarity, not exact identity or a documented variant relationship.
