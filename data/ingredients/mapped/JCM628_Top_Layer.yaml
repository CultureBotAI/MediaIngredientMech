notes: 'Semisolid top-layer preparation of JCM 628, used by CultureMech:010042. Nested
  carrier input recipe: [["NH4Cl", "1.0", "G_PER_SOURCE_BATCH"], ["MgSO4·7H2O", "0.2",
  "G_PER_SOURCE_BATCH"], ["CaCl2·2H2O", "0.1", "G_PER_SOURCE_BATCH"], ["KH2PO4", "0.05",
  "G_PER_SOURCE_BATCH"], ["Distilled water", "1.0", "L_PER_SOURCE_BATCH"]]. JCM 197
  trace-mineral stock input recipe: [["Nitrilotriacetic acid", "4.5", "G_PER_SOURCE_BATCH"],
  ["FeCl2·4H2O", "0.4", "G_PER_SOURCE_BATCH"], ["MnCl2·4H2O", "0.1", "G_PER_SOURCE_BATCH"],
  ["CoCl2·6H2O", "0.17", "G_PER_SOURCE_BATCH"], ["ZnCl2", "0.1", "G_PER_SOURCE_BATCH"],
  ["CaCl2·2H2O", "0.02", "G_PER_SOURCE_BATCH"], ["H3BO3", "0.019", "G_PER_SOURCE_BATCH"],
  ["Na2MoO4·2H2O", "0.01", "G_PER_SOURCE_BATCH"], ["NiCl2·6H2O", "0.03", "G_PER_SOURCE_BATCH"],
  ["Distilled water", "1.0", "L_PER_SOURCE_BATCH"]], followed by pH 7.0 adjustment
  with 1N KOH (amount unstated). JCM 197 trace-vitamin stock input recipe: [["Biotin",
  "2.0", "MG_PER_SOURCE_BATCH"], ["Folic acid", "2.0", "MG_PER_SOURCE_BATCH"], ["Pyridoxine·HCl",
  "10.0", "MG_PER_SOURCE_BATCH"], ["Thiamine·HCl", "5.0", "MG_PER_SOURCE_BATCH"],
  ["Riboflavin", "5.0", "MG_PER_SOURCE_BATCH"], ["Nicotinic acid", "5.0", "MG_PER_SOURCE_BATCH"],
  ["Calcium pantothenate", "5.0", "MG_PER_SOURCE_BATCH"], ["Vitamin B12", "0.1", "MG_PER_SOURCE_BATCH"],
  ["p-Aminobenzoic acid", "5.0", "MG_PER_SOURCE_BATCH"], ["Lipoic acid", "5.0", "MG_PER_SOURCE_BATCH"],
  ["Distilled water", "1.0", "L_PER_SOURCE_BATCH"]]. These nested recipes document
  carrier identity; their water is not counted again as an immediate top-layer component.
  Adjust top-layer pH to 6.2 and autoclave; cool to 35–40 °C before adding the 1 ml
  JCM 197 trace-vitamin stock, then adjust pH to 6.1–6.4 by sterile CO2 bubbling.
  Overlay 3.75 ml on the solidified bottom layer and allow to solidify. The bottom
  layer and cultivation headspace gases are outside this material. Six known immediate
  recipe inputs are represented. The initial pH-adjustment reagent is unspecified
  and dissolved CO2 uptake is unquantified; no CO2/headspace gas amount or molecular
  speciation is inferred. This is a source-qualified preparation, not the entire two-layer
  growth medium. Raw source labels remain source-scoped in the decisions; no generic
  label is published as a global synonym. Quantified components use the literal preparation
  batch unless explicitly marked MG_PER_L. Component names retain source specificity
  without inferred vitamer, hydrate or stereoisomer IDs. Occurrence counts remain
  zero pending source-specific integration. No roles or downstream hold release is
  proposed.'
