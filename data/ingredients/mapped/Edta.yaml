    notes: 'identifier/ontology_id CHEBI:64755 (''EDTA(2-)'') -> CHEBI:4735 (''ethylenediaminetetraacetic
      acid''); mapping_quality -> SYNONYM_MATCH. ChEBI''s live definition of CHEBI:64755
      is ''a tetracarboxylic acid anion formed by deprotonation of TWO of the four
      carboxy groups'' — a specific charge state this record''s label never asserts.
      Under #319''s rule a specific definition means descend, unlike the ''at least
      one'' wording that keeps the anion. Absorbed ''EDTA (acid form)'', which held
      the free-acid term with ZERO occurrences and already carried ''EDTA'' as a synonym.
      The corpus keeps separate Na2-EDTA records for the salt, so plain ''EDTA'' denoting
      the free acid is consistent with how the rest of the family is modelled.'
