  evidence:
  - evidence_type: LLM_SUGGESTION
    source: https://www.dsmz.de/microorganisms/medium/pdf/DSMZ_Medium1191.pdf
    notes: The source grade demineralized water is explicitly named in all nine admitted
      ingredient1448 rows across DSMZ1191,1279,1600 and1793, including the source
      abbreviations H2O demin. and Aqua dem. It is represented as a distinct preparation-qualified
      solvent, with CHEBI15377 water as a broader molecular parent only. No ion-removal
      method, conductivity, resistivity, reagent standard, quantitative purity or
      universal sterility is asserted. The one sterile addition in DSMZ1600 retains
      that operational qualifier in its recipe; this owner does not globally equate
      sterile water, distilled water or tap water. The exact-name OLS search found
      TransformON c_ROHSUO, but TFO is outside the maintained OntologySourceEnum and
      its conductivity scope is not specified by these sources; the candidate is preserved
      as context rather than silently adopted or reported absent.
  - evidence_type: CURATOR_JUDGMENT
    source: https://www.dsmz.de/microorganisms/medium/pdf/DSMZ_Medium533.pdf
    notes: Source-qualified preparation/material identity under MAPPING_SEMANTICS
      sections 3 and 6; inspected bounded ontology searches found no exact supported
      term. No exact mapping to a solute or generic water is asserted.
  - evidence_type: LLM_SUGGESTION
    source: https://github.com/CultureBotAI/MediaIngredientMech/issues/1237#issuecomment-6720120537
    notes: 'Ordinary unspecified ion-removal-grade water in the reviewed deionized/demineralized
      source contexts. ELGA laboratory-water guide page 5 supports their ordinary
      synonymous use and distinguishes distillation. The local preparation-grade identity
      is narrower than molecular water: CHEBI:15377 is a broader parent only (NARROW_MATCH/native
      broadMatch with mandatory local registry identity row). No universal treatment
      method, purity, resistivity, ASTM/ISO class or sterility is asserted. DSMZ1600
      sterile handling belongs only to its exact addition. Maintained Distilled_Water
      and its historical Demineralized water REJECTED_LABEL remain untouched. No molecular-water
      has-part edge is added. Genuine W06 DI WATER reuse of the W08 proposal is retained
      through its existing source-case/occurrence bridge, not a fabricated seventh
      proposal. DI WATER and H2O (deionized) stay source-specific; frozen unit discrepancies
      do not become material concentrations. Original evidence items are retained
      verbatim for their named source-specific origins; they are not inherited final
      combined-owner approval.'
