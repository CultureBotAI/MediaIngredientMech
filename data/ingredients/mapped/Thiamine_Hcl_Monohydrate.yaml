  parent relationship, not the positive source-defined one-water material representation.
  The exact raw source forms are retained as sourced RAW_TEXT synonyms. Each recipe
  lists 5 mg in a multivitamin preparation whose water input is 1 L; those preparation
  quantities, its pH adjustment and receiving doses do not become properties or components
  of this single ingredient. No chemical_properties, supplied supplier/catalog, roles
  or material partonomy are inferred. CHEBI:49105 and CHEBI:132751 are comparison
  terms, not exact identities or asserted parents for this record. Registry-only grounding
  records the bounded local form while the specific molecular parent remains unresolved.
  All frozen source, owner, observation and export holds remain; this isolated proposal
  does not install an owner or authorize downstream publication. Occurrence statistics
  are limited to the six assigned frozen occurrences in six distinct recipes; no global
  source count is claimed.
