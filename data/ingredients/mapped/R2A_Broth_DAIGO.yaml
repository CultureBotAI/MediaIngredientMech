notes: One named DAIGO dry broth product, not a prepared medium or R2A agar. Manufacturer
  disclosure sums to 3.15 g of listed dry ingredients per preparation with 1 L purified
  water; NBRC1455 instructs 3.2 g of product. Preserve both statements without inventing
  a missing filler, changing a dose, or claiming measured final volume. JCM805 uses
  0.32 g, JCM659 and NBRC991 use 1.6 g, and NBRC1347 uses 0.32 g in their receiving
  recipes. Different receiving doses do not create new powder identities. The generic
  DSMZ1537 R2A broth occurrences and the complete mixed MediaDive1402 case are not
  assigned globally to DAIGO. Exact component procurement forms not supplied by the
  table remain ungrounded; no generic peptone owner is substituted. Original published
  proposal files and their full source cases, occurrences, evidence and historical
  assertions are immutable in family-reconciliations-v1. Historical proposal events
  below describe original isolated proposals, not maintained applications. Their former
  identity/quantity choices are superseded only by this explicitly documented private
  reconciliation. No current owner or corpus count is modified. Current-origin bridge
  retains the exact W03 and W05 source profiles, their distinct evidence judgments
  and provenance-correction events. The JCM839 BD-Difco recipe constituents remain
  source context, not procurement claims for the DAIGO product. The manufacturer batch
  table continues to define this dry-product candidate. All six case objects, generic
  DSMZ1537 and mixed MediaDive1402 exclusions remain external scoped routing evidence;
  no occurrence count is inferred. W05 source acceptance was pending at the pinned
  planning cutoff. Both original proposals are null-before private creations, not
  maintained owners.
