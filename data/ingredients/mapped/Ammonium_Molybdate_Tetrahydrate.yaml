      is the heptamolybdate; CHEBI:91249 ''ammonium molybdate'' is the diammonium
      orthomolybdate (2H4N.MoO4, one Mo), a different polyanion, not the anhydrous
      parent of this hydrate. ChEBI has the substance: CHEBI:86244 ''hexaammonium
      heptamolybdate tetrahydrate'' (4H2O.6H4N.Mo7O24) carries the related synonym
      ''ammonium molybdate tetrahydrate'', the record''s exact label, on no other
      term. Section 3 step 1 with a unique synonym: SYNONYM_MATCH. The CAS stays on
      its registry row.'
