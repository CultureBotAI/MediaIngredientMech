notes: 'MediaDive ingredient2112 usage points to DSMZ438, whose original title identifies
  DIFCO and specifies Bordet-Gengou-Agar-Base before15% horse blood. The KG entry
  measures1000ml prepared base, so this source-qualified prepared-medium owner is
  distinct from the predecessor Difco dry-base product. The dry base is an identified
  material input; hydration quantity/final formulation are unknown and not invented.
  Historical generic and BD248200 aliases on the old imported2112 owner are retained
  as provenance, not asserted as exact identities to this ready base. No M2850 sheep-blood
  source is joined by exact identity to this horse-blood source. Raw source labels
  and optional/use instructions are retained in source-case evidence, not installed
  as global resolving aliases. Existing source/owner/export holds remain; no maintained
  or release approval. Prior labels and curation provenance: [{"synonym_text": "Bordet-Gengou-Agar-Base",
  "synonym_type": "RAW_TEXT", "source": "mim-queue"}, {"synonym_text": "Bordet-Gengou
  Agar Base (BD 248200)", "synonym_type": "CATALOG_VARIANT", "source": "culturemech:output/ingredient_occurrences.tsv"}].
  These historical source labels are retained here; no generic label is asserted as
  an exact source formulation synonym. Comparative source annotation only: TOGO M2850
  (worker04 case111, not DSMZ111) explicitly gives1L prepared Bordet-Gengou basal
  agar and a separate15% sheep-blood addition. It supplies no basal formula or vendor.
  DSMZ438 and ingredient2112 independently identify a Difco prepared basal medium
  with separate15% horse blood. These contexts establish the basal-versus-supplement
  boundary, but do not establish whether the two basal preparations have identical
  formulations or procurement identities. M2850 is not resolved to this Difco438 owner,
  no M2850 alias or recipe-equivalence is added, and the1L figure is the receiving
  recipe quantity, not an invented water component. The existing Difco438 identity
  and its partial component assertion remain unchanged. A source formula or product
  specification for M2850 that permits comparison with the Difco preparation is the
  remaining exact-identity fact. Additional comparison context: TOGO M2851 names1L
  prepared Difco Bordet-Gengou basal agar before15% TCS horse blood. It has no original-source
  URL or basal formulation. The brand and material description are compatible with
  DSMZ438, but identical preparation is not established. This documents M2851 prepared-basal
  usage without a new duplicate owner, an exact source association, a global alias,
  a recipe-equivalence reference or an invented water component; the DSMZ438 owner
  identity remains specifically qualified.'
