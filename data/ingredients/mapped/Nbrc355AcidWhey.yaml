notes: '#1201 isolated proposal: NBRC 355 directs adding HCl to warmed milk to coagulate
  it, centrifuging, and using the supernatant as cheese whey. The source-defined output
  can be represented without a quantified yield. Starting milk and HCl are processing
  inputs; precipitated milk proteins are removed, and their masses or final retained
  fractions are not asserted as has-part components. Applies only to CultureMech 015901/nbrc.medium
  355 in case 23. Milk source, acid quantity, temperature and centrifugation settings
  are not stated; no acid/rennet or formulation equivalence is asserted for the other
  six case 23 occurrences. The distinction from generic cheese whey is the positively
  stated HCl-coagulation/centrifugation process, not merely a different recipe citation.
  Raw source spellings are retained in case evidence and this source scope; no new
  globally resolving source-local alias is added. Full-owner publication approval
  and all source-specific holds remain pending.'
