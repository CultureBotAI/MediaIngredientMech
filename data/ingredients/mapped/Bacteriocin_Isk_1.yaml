notes: '2026-11-08 source review: Sashihara et al.2000 (PMID11193411,DOI10.1271/bbb.64.2420)
  and2001 (DOI10.2323/jgam.47.143) establish that the former Pediococcus sp.ISK-1
  producer was reidentified as Staphylococcus warneri ISK-1. Producer names therefore
  do not establish two different bacteriocins. Exact promotion remains unresolved:
  this metatraits source lacks original peptide/assay provenance,and live CHEBI:204272
  labels Nukacin ISK-1 while its1178.444Da short-peptide structure does not establish
  the primary reported mature27-residue lantibiotic. Retain kgmicrobe.compound:bacteriocin_isk_1;
  require source trace and ontology structure reconciliation before exact mapping.'
