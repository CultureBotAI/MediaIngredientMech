      adjusting that initial solution to pH 6.5 with KOH; the 200 mL is within the
      listed preparation water. NBRC does not specify final stock pH or an explicit
      final-volume instruction. JCM284 first dissolves NTA in 200 mL water with KOH
      to pH 6.5, adds remaining salts, makes the final volume 1.0 L, then readjusts
      to pH 7.0 with KOH. Only JCM establishes final 1 L/pH 7.0. No 1.2 L water, fixed
      KOH amount/strength, common final concentration, equal final pH or post-reaction
      species is asserted. COMPLETE describes the twelve explicitly named immediate
      inputs (ten dry substances, distilled water, KOH), not analytical speciation.
      The separate vitamin and Se/W preparations remain excluded. Original evidence
      items are retained verbatim for their named source-specific origins; they are
      not inherited final combined-owner approval.
