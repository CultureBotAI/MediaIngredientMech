  this is a source-qualified stock formulation, not a fixed solution-speciation assertion.
  Quantity units preserve masses per the listed one litre of preparation water, not
  a measured final litre after salts and KOH addition. Unqualified Medium No.976 cross-reference
  aliases are retained as REJECTED_LABEL; only the collection-qualified JCM976 name
  resolves globally.
