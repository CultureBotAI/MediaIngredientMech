notes: The aqueous supernatant obtained by the NBRC 1356 Mineral base 1 protocol.
  Preparation identity is supported despite unmeasured dissolved composition; Assertion
  of UNKNOWN completeness includes only the interpreted aqueous carrier. Charge Na2CO3
  185 g, NaHCO3 35 g, NaCl 16 g and K2HPO4 1 g to distilled water 1 L. Autoclave under
  nitrogen; after one day of precipitation use only supernatant. Stated final pH is
  10. The charged salts and their masses are precursor inputs, not asserted retained
  solutes or dissolved concentrations. Supernatant recovery volume is unknown. Nitrogen
  atmosphere is a process condition and is not a component. Raw source labels remain
  source-scoped in the decisions; no generic label is published as a global synonym.
  Quantified components use the literal preparation batch unless explicitly marked
  MG_PER_L. Component names retain source specificity without inferred vitamer, hydrate
  or stereoisomer IDs. Occurrence counts remain zero pending source-specific integration.
  No roles or downstream hold release is proposed.
