identifier: CHEBI:30411
preferred_term: Cobalamine
ontology_mapping:
  ontology_id: CHEBI:30411
  ontology_label: cobalamin
  ontology_source: CHEBI
  mapping_quality: EXACT_MATCH
  evidence:
  - evidence_type: DATABASE_MATCH
    source: CultureMech
    notes: Imported from CultureMech pipeline, quality=DIRECT_MATCH
  - evidence_type: DATABASE_MATCH
    source: MIM curation (#320/#319)
    notes: 'identifier and ontology_id CHEBI:28911 -> CHEBI:30411. ChEBI''s live definition
      of CHEBI:28911 is ''A cobalamin in which the central cobalt atom has an oxidation
      state of +3'' — it specifies an oxidation state this record''s label does not.
      ''Cobalamine'' names the vitamer generically, so MAPPING_SEMANTICS §3 step 4
      gives it the generic term CHEBI:30411 (''cobalamin''), which was unheld. The
      record''s own CAS 18534-66-2 is registered by ChEBI against cob(I)alamin — a
      *third* oxidation state — which is the #320 conflict that surfaced this and
      is itself evidence the record was never specific to +3. Definition read from
      the live EBI OLS4 API, since #319 records that the local ChEBI build lacks definitions
      for some of these terms.'
  - evidence_type: DATABASE_MATCH
    source: MIM curation (#138/#320)
    notes: 'Cleared cas_rn, molecular_formula, inchi and smiles, and moved kg_microbe_node_id
      CHEBI:28911 -> CHEBI:30411. Every one of these encoded the +3 oxidation state
      this record does not assert. The formula/InChI/SMILES were written by AUTO_BACKFILL_CHEBI_CHEMISTRY
      on 2026-05-01 by copying CHEBI:28911 while the record was mapped there, so they
      were a transcription of the grounding rather than evidence for it — the InChI
      still ended ''/q;+3/p-2''. The cas_rn 18534-66-2 is cob(I)alamin (KEGG C00853,
      ChEBI:15982, Gmelin 887721), a THIRD oxidation state, and came from a PubChem
      name lookup — the mechanism that also put CHES on Beef extract. CHEBI:30411
      deliberately carries no formula, charge or mass because its oxidation state
      is unspecified, so a record grounded there must not carry structure fields that
      fix one. Leaving them would re-seed the same wrong inference on any future automated
      re-grading. Note the formula does not discriminate oxidation state in any case:
      ChEBI records the identical C62H88CoN13O14P for cob(II)alamin and cob(III)alamin,
      which differ only in the charge field.'
