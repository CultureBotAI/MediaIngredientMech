ontology_mapping:
  ontology_id: CHEBI:37585
  ontology_label: sodium dihydrogenphosphate
  ontology_source: CHEBI
  mapping_quality: CLOSE_MATCH
  evidence:
  - evidence_type: DATABASE_MATCH
    source: CultureMech
    notes: '[HISTORICAL — superseded by the #321 re-grade below: this record is a
      hydrate of CHEBI:37585, not an exact match to it] Imported from CultureMech
      pipeline, quality=DIRECT_MATCH'
  - evidence_type: DATABASE_MATCH
    source: MIM curation (#321/#334)
    notes: identifier CHEBI:37585 -> kgmicrobe.compound:nah2po4_x_2_h2o; mapping_quality
      SYNONYM_MATCH -> NARROW_MATCH. The record is a hydrate of CHEBI:37585 ('sodium
      dihydrogenphosphate') and was sharing that term's identifier — the identity
      collapse MAPPING_SEMANTICS §3 forbids, which made a distinct substance indistinguishable
      from its anhydrous parent downstream. ChEBI has no term for this hydrate and
      the record carries no verified CAS, so steps 1 and 2 are unavailable and step
      3 applies.
  - evidence_type: DATABASE_MATCH
    source: MIM curation (#321)
    notes: molecular_formula 'H2O4P.Na' -> 'H2O4P.Na.2H2O'. The recorded value described
      the anhydrous salt while the label names a hydrate, understating the mass by
      18 g/mol per water. Corrected because the label states 2 water(s) of hydration,
      and the recorded formula was byte-identical to the anhydrous parent CHEBI:37585's
      ChEBI formula ('H2O4P.Na') — the mark of a value inherited from the parent rather
      than measured for this record. Water appended in ChEBI's own dot-separated notation.
  - evidence_type: DATABASE_MATCH
    source: MIM curation (#342)
    notes: 'mapping_quality NARROW_MATCH -> CLOSE_MATCH, predicate skos:narrowMatch
      -> skos:closeMatch. narrowMatch asserts this record is *narrower in meaning*
      than CHEBI:37585 (''sodium dihydrogenphosphate'') — a subsumption ChEBI itself
      denies: it files hydrates under CHEBI:35505 ''hydrate'', never under the anhydrous
      compound, which is not an ancestor even transitively. A hydrate is a distinct
      substance containing the anhydrous form, not a specialization of it. closeMatch
      claims similarity without subsumption. The ontology_id and the record''s own
      identifier are unchanged.'
