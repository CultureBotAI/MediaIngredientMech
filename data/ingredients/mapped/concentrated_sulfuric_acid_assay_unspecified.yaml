  evidence:
  - evidence_type: LLM_SUGGESTION
    source: https://togomedium.org/sparqlist/api/gmdb_medium_by_gmid?gm_id=M2241
    notes: M2241 DH micronutrient solution explicitly uses0.5mLconcentrated H2SO4.
      Source names a concentrated preparation but supplies no numerical assay, water
      amount or density. Represent only this source-qualified material; no97%,98%
      or standard molarity is invented. TOGO M1020/JCM970 specifies2mLconcentrated
      sulfuric acid; ATCC920-derived M3142/M3140 micronutrient stocks specify0.5mL.
      This bounded named-material record captures only the shared stated concentrated-acid
      description; no equal assay or full-formulation equivalence is claimed between
      the source preparations. ATCC203/TOGO M2236 SolutionC lists0.05mLconcentrated
      H2SO4 alongside0.5gFeSO4·7H2O,0.14gEDTA and100mLwater. Those other constituents
      belong to SolutionC, not the supplied concentrated acid. Assay and solvent composition
      of the acid are unspecified. UTEX BBM trace stock explicitly lists10mLconcentrated
      H2SO4 and makes the total trace-stock volume1L. That establishes the acid volume
      per litre of trace stock, not the acid assay. This owner captures the supplied
      concentrated acid with no assumed97/98% strength. Source IDs do not establish
      distinct substances, so one bounded unspecified-assay material is proposed.
      This shared record asserts only the common named preparation, not equal commercial
      assay or interchangeability of unknown formulations. Component completeness
      is UNKNOWN. Unstated solvent, hydration, assay and final volume are not invented.
      This is the named preparation at the cited source scope; no full-formulation
      equivalence with other products is asserted.
