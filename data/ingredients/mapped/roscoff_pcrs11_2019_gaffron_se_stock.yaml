notes: Roscoff PCR-S11 protocol2019 (DOI10.17504/protocols.io.sz3ef8n), section4,
  defines this Gaffron+Se stock by adding the15listed solutes to500ml water then making
  a final1L, refrigerated. The payload transcribes the printed mg/L column, not recalculated
  rounded micromolar values. Actual PDF pages4–5 confirm cadmium nitrate Cd(NO3)2·4H2O
  and potassium aluminium sulfate KAl(SO4)2·12H2O; these are not guesses from TOGO
  malformed Cd(NO3).4H2O and KAI(SO4)2.12H2O. Raw TOGO text remains unchanged in evidence.
  The protocol prints5.16mg/L ammonium molybdate tetrahydrate and1.5mg/L vanadyl sulfate
  pentahydrate, with footnotes4.94 and1.52 respectively for the original recipe. Its
  receiving medium uses0.1ml/L and states this gives twice the original PCR-S11 Gaffron
  level. TOGO M2262 instead records0.5ml/L and a stock table roughly tenfold lower
  (for example H3BO3 300uM versus this protocol3008.25uM; Ni salt3uM versus30uM).
  These versions and inconsistent source-dose context are not collapsed. The frozen0.5G_PER_L
  is also a volume/unit error. This concrete2019stock is a version-qualified related
  preparation proposal, not automatic identity or composition assignment to the frozen
  M2262 occurrence. Raw Trace metals Gaffron+Se is not a global alias. All child references
  remain UNMAPPED, and no complete-medium release is implied. Protocol section6 states
  that added nutrients have been autoclaved except vitamins; the listed Gaffron+Se
  nutrient stock is therefore autoclaved before receiving-medium addition. No temperature
  or duration is supplied or invented.
