notes: 'JCM1389 defines this preparation from a grown culture of strain Acc8 (=JCM39386)
  in JCM Medium1388. Centrifuge the grown culture (source example: 10000 x g for 10
  min), remove the supernatant and autoclave it under N2-CO2 (80:20,v/v). The receiving
  recipe specifies storage under N2 and aseptic anaerobic addition of 400 ml. This
  denotes the processed culture supernatant, not strain/taxon identity, intact cells,
  unconditioned Medium1388 or a measured chemical mixture. Growth duration, harvested
  biomass and metabolite composition are not supplied; no invented component list
  or quantitative chemical completeness is asserted. Raw label Culture supernatant
  (see below) is preserved only in this JCM1389 occurrence; it is not a global synonym.'
