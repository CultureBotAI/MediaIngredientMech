    notes: Claim-specific inherited-label assessment by Codex /root/step7d_science_c
      under https://github.com/CultureBotAI/MediaIngredientMech/issues/718#issuecomment-6724713374.
      The unqualified kg_microbe Hemodal entry is not a unique identity-bearing name
      for this neutral menadione owner. Santa Cruz sc-205990 sections1/3 (https://datasheets.scbt.com/sc-205990.pdf)
      use Hemodal for menadione CAS58-27-5, while sc-215295 sections1/3 (https://datasheets.scbt.com/sc-215295.pdf)
      use it for menadione sodium bisulfite CAS130-37-0. Exact browser-extracted primary
      sections are retained in W02 research/c/search-07.json; failed direct HTTP bodies
      are separate. The Bayer advertisement in Coimbra Medica February1945 PDF page22
      separately identifies a derivative tablet and sodium-bisulfite injection (https://am.uc.pt/romulo/download/wqnDk8Kjw5jDjsOQwpJpaGNtbGFuwpzClsKZwp9nwpM%3D/UCRC-Coimbra-Medica-1945-02.pdf;
      complete PDF SHA256 691a9d0f916fca89f5d97b4f72e3c028d66e5d650915c895c74d9bd04c1028ca;
      visual page SHA256 2a1a5d83ca40a51ed5e52c61cbd314377b53bf945cfe33a0ca4aa91469a1d107).
      This affirmative form ambiguity justifies only the unqualified entry's nonresolving
      REJECTED_LABEL disposition under MAPPING_SEMANTICS section3. Positive neutral-menadione
      usage in NIST (https://webbook.nist.gov/cgi/cbook.cgi?ID=C58275&Units=SI), ChEBI
      and sc-205990 remains valid contextual evidence; not every Hemodal use is false.
      Preserve its spelling/source/history, supported Aquakay/Aquinone/Kappaxin chemical-name
      senses, known CHEBI28869/CAS58-27-5 identity, and the ATCC1257 50mg solute versus
      separate ethanol/water stock boundary and unvalidated flattened dose. No replacement
      identity, product equivalence, role or export approval is inferred.
