ontology_mapping:
  ontology_id: CHEBI:91248
  ontology_label: L-cysteine hydrochloride hydrate
  ontology_source: CHEBI
  mapping_quality: NARROW_MATCH
  evidence:
  - evidence_type: DATABASE_MATCH
    source: MIM curation (#288)
    notes: 'A prepared solution of a single compound: STOCK_SOLUTION, so it takes
      a kgmicrobe.ingredient: mint rather than the compound''s own identifier, with
      a narrowMatch to that compound — the shape used for MES/PIPES/MOPS buffers in
      #114. For PBS, note the term is NCIT:C178908 ''phosphate-buffered saline'';
      searching the bare acronym instead returns NCIT:C122728 ''TSPO wt Allele'',
      a gene allele (#288).'
  - evidence_type: DATABASE_MATCH
    source: MIM curation (#342)
    notes: 'mapping_quality NARROW_MATCH -> CLOSE_MATCH, predicate skos:narrowMatch
      -> skos:closeMatch. narrowMatch asserts this record is *narrower in meaning*
      than CHEBI:91247 (''L-cysteine hydrochloride'') — a subsumption ChEBI itself
      denies: it files hydrates under CHEBI:35505 ''hydrate'', never under the anhydrous
      compound, which is not an ancestor even transitively. A hydrate is a distinct
      substance containing the anhydrous form, not a specialization of it. closeMatch
      claims similarity without subsumption. The ontology_id and the record''s own
      identifier are unchanged.'
  - evidence_type: DATABASE_MATCH
    source: MIM curation (#321)
    notes: Repointed the local solution identity's parent from CHEBI:91247 to the
      hydrate-specific CHEBI:91248 ('L-cysteine hydrochloride hydrate'). The record
      still denotes a prepared solution, not the pure ChEBI compound, so it keeps
      its kgmicrobe.ingredient identifier and closeMatch grade.
  - evidence_type: LLM_SUGGESTION
    source: https://github.com/CultureBotAI/MediaIngredientMech/issues/901#issuecomment-6724895813
    notes: 'Claim-specific current form-of assessment under https://github.com/CultureBotAI/MediaIngredientMech/issues/901#issuecomment-6724895813.
      JCM680 (https://www.jcm.riken.jp/cgi-bin/jcm/jcm_grmd?GRMD=680; exact captured
      HTML SHA25616525b97d468855002dda4489f4b2030d28a9a1d332828cc27a0f2e15b5b07f0)
      explicitly names L-cysteine hydrochloride monohydrate solution. The active defining
      CHEBI:91248 term is L-cysteine hydrochloride hydrate, a monohydrate of L-cysteine
      hydrochloride (full OLS term capture SHA2567ef9e26cec1a5833d216a01df066c0b6a0bfba77bad16db354c690a7a814a683).
      This remains a local prepared stock, not the pure solute. Current MAPPING_SEMANTICS
      sections1/3 explicitly permit the solution-of broader-parent relation without
      is_a or identity equivalence; native NARROW_MATCH therefore publishes skos:broadMatch
      while retaining the local exact registry row. The historical #342/#321 rationale
      and evidence are preserved, but no longer justify CLOSE_MATCH under the current
      contract. The source10mL is an addition dose, not stock concentration; solvent,
      concentration, stock pH, complete formulation and quantity interpretation remain
      unknown. No solute CAS, structure, formula or role is assigned to the stock;
      rejected instruction and QSY9 labels, counts and all original source decisions
      remain unchanged.'
