- timestamp: '2026-08-18T00:00:00+00:00'
  curator: merge_aldehydo_duplicates
  action: MERGED_FROM
  changes: 'Absorbed ''n-Acetyl-muramic acid'' (CHEBI:47966 aldehydo- form) into CHEBI:47965
    (#398). Both records name the same substance — the muramic pair carry an identical
    CAS and formula — split across a ChEBI class term and its open-chain aldehydo-
    form. The class term wins because the identifier optimises for how the node READS
    in the knowledge graph: no catalogue sells an ''aldehydo-'' tautomer, and MIM
    is kg-microbe''s naming authority, so grounding here would rename the ChEBI node
    after a minor solution-equilibrium component. ChEBI does hang the commercial CAS
    (10597-89-4) on the aldehydo- term, which is why the earlier reading of the orderability
    rule pointed the other way; that CAS is now carried in supplied_form and republished
    as a synonym, so nothing purchasable is lost from the identity. Occurrences 1/1
    + 10/10 -> 11/11.'
  llm_assisted: false
- timestamp: '2026-08-18T00:00:00+00:00'
  curator: merge_aldehydo_duplicates
  action: FOLDED_MERGED_SYNONYMS
  changes: 'Folded 3 synonym(s) from ''n-Acetyl-muramic acid'': [''(R)-2-acetamido-3-O-(1-carboxyethyl)-2-deoxy-D-glucose'',
    ''2-acetamido-3-O-[(1R)-1-carboxyethyl]-2-deoxy-aldehydo-D-glucose'', ''aldehydo-N-acetylmuramic
    acid'']. The merge kept the loser''s LABEL but left its own synonyms on the tombstone.
    They still resolved via label_index, which publishes REJECTED rows, but the tombstone''s
    SSSOM row was dropped — so they no longer reached KGX. These are real chemical
    names (D-Lyx, D-lyxo-pentose, the systematic forms), not notation noise.'
  llm_assisted: false
