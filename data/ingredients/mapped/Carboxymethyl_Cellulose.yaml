  curator: merge_cmc_records
  action: MERGED_FROM
  changes: 'Absorbed ''Carboxymethyl cellulose (sodium salt)'' (#394). The two were
    crossed: the generic-looking record held the SALT''s term (CHEBI:234035) while
    the salt-labelled record held FOODON:03460374. Codex read the four source strings
    behind this record''s occurrences and they are genuinely mixed — 2 plain (''Carboxymethyl
    cellulose'', KOMODO 1111 and DSMZ 1111) and 2 explicitly sodium salt (''Carboxymethyl
    cellulose, sodium salt'', JCM 1052; ''Carboxymethylcellulose (CMC), sodium salt'',
    DSMZ 1684) — and DSMZ 1111''s own prep note specifies the sodium salt. CultureBotHT''s
    compounds_to_cas.csv maps BOTH the plain and the sodium name to the same CAS 9004-32-4,
    so the upstream conflation is already there. Resolved under the orderability rule:
    an ingredient maps to a specific chemical someone can order, picking one by convention
    when sources disagree. CHEBI:234035 carries cas:9004-32-4 — the product a lab
    buys — while the plain term CHEBI:85146 carries cas:9000-11-7, a different purchase.
    Both labels remain resolvable as synonyms.'
  llm_assisted: false
