    notes: DSMZ885 identifies poly(hexamethylene carbonate), PHC, from Toagosei with
      number-average molecular mass 2000, and lists Plysurf A210G surfactant separately.
      This is the polymer ingredient; its chain-length distribution and undisclosed
      end groups do not make its identity unknown. The emulsion and entire PHC medium
      are distinct preparations. The Beijing environmental authority chemical inventory
      entry11389 independently identifies CAS61630-98-6 as the carbonate polymer of1,6-hexanediol,
      also called polycarbonate diol; the supplier TechServe Solutions explicitly
      names poly(hexamethylene carbonate) diol under that CAS. These corroborate the
      source CAS at its registered polymer scope, without selecting a new grade or
      assigning a fixed chain length. CommonChemistry API401, its navigation-only
      HTML and the publisher403 are unsuccessful verification routes, not negative
      chemical findings. No fixed molecular formula, molecular weight, end-group structure,
      or monomer components are asserted.
