    notes: CHEBI61433 is polycarbonate polymer, a broader polymer class. Exact-name
      search retrieved copolymers with different comonomers, not this homopolycarbonate.
      CAS primary and asymmetric parent grounding follow MAPPING_SEMANTICS section3;
      variable chain length does not justify bypassing a verified polymer registration.
