    it away: it carries ''Role: Mineral source'' and ''K-F''. Its cas_rn 6235-35-4
    was then derived FROM the wrong term (curation history: ''Added CAS-RN 6235-35-4
    from PubChem (via CHEBI:73605)''), so the CAS is downstream of the error rather
    than independent evidence against it — the same cascade as ''D''. Potassium fluoride
    is CHEBI:66872, already held by this record. The dipeptide formula, SMILES and
    its derived CAS are removed rather than carried onto the tombstone. Tombstoned
    REJECTED, SSSOM rows dropped.'
