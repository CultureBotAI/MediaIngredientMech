      resolves to the water-free salt and is not selected as exact hydrate primary.
      CHEBI31380 is the verified water-free sodium salt and the closest inspected
      parent. NARROW_MATCH exports broadMatch; do not select NCITC98228 as exact hydrate
      because it describes the same water-free salt. Dry structures were already removed
      in7b. Move the remaining procurement CAS out of unqualified chemical_properties.cas_rn
      into supplied_form; preserve source/retrieval metadata and full old history.
      Primary source references: https://www.sigmaaldrich.com/US/en/product/sigma/c8145;
