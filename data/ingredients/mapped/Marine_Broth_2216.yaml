notes: 'Imported from mim-queue (source_id=mediadive.ingredient:1607); no CAS-RN or
  CHEBI/NCIT match. Curator review needed. Correction1193: Exact Difco2216 source
  cases identify commercial broth37.4g, with separate receiving supplements. Existing
  mapped2216 record erroneously treats the ATCC agar-minus-agar scratch recipe as
  the commercial broth formula. Manufacturer-authored Difco manual distinguishes broth
  MgCl2 5.9g/MgSO4 3.24g from agar MgCl2 8.8g/Na2SO4 3.24g. Correct commercial product
  composition and retain source recipe variants as distinct. This proposal neither
  merges generic MarineBroth/DifcoMarineBroth records nor approves their complete
  use scopes. Cross-shard worker03 proposal b-proposal-marine-aliases edits the same
  owner and requires coordinator reconciliation against the original before hash.


  Current source-bound correction (W05-MEDIA-F01, #1208/#1193): The existing registry
  denotes the named commercial Difco Marine Broth 2216 preparation. The manufacturer
  manual, printed pages 351-352, independently lists broth and agar formulas: broth
  has magnesium chloride 5.9 g and magnesium sulfate 3.24 g per litre at standard
  reconstitution; agar has magnesium chloride 8.8 g and sodium sulfate 3.24 g. Thus
  the products do not differ only by agar. The corrected sixteen-part commercial broth
  formula is retained; unspecified salt forms remain UNMAPPED. The old MIM curation
  (#260) assertion and ATCC agar-minus-agar transcription are historical provenance,
  not the active identity basis. This source-bound correction does not merge generic
  marine-medium owners or resolve worker03 same-owner alias reconciliation.'
