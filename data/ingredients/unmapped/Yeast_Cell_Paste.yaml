  action: ANNOTATED
  changes: 'Edison LITERATURE (PaperQA3) identity research; report at research/ingredients/Yeast_cell_paste-edison-literature.md
    (local artifact — research/ is gitignored, so the findings are quoted here rather
    than linked). Report verdict: **Recommended interpretation:** “Yeast cell paste”
    is a **process-defined, wet concentrate of harvested whole yeast cells**, not
    a single chemical, salt/hydrate, buffer, culture medium, or fixed commercial formulation.
    Primary literature describes harvested yeast frozen as cakes and later resuspended
    before mechanical lysis; therefore, lysis and extraction occur *after* formation
    of the cell paste (david1997expressionandpurification pages 3-4, david1997expressionandpurification
