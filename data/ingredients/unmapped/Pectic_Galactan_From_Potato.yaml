  changes: 'Edison LITERATURE (PaperQA3) identity research; report at research/ingredients/Pectic_galactan_from_potato-edison-literature.md
    (local artifact — research/ is gitignored, so the findings are quoted here rather
    than linked). Report verdict: **Recommended interpretation:** a **potato-derived
    pectic polysaccharide fraction/model substrate**, not a single defined chemical,
    salt, hydrate, buffer, or complete medium formulation. The best-supported structural
    feature is β-(1→4)-linked D-galactan. In native plant walls, such galactan generally
    occurs as side chains of rhamnogalacturonan I (RG-I), whose backbone alternates
    rhamnose and galacturonic-acid residues and may also bear arabinan and arabinogalactan
    substituents. Potato pectin is particularly galactan-rich; one source estimates
    β-1,4-galactan at approximately 30–40% of potato pectin. (liwanag2012pectinbiosynthesisgals1
    pages 1-2) No ontology CURIE was proposed. Recorded as provenance only — no grounding
    applied from this run. Edison''s recommendations are deliberately conservative,
    and a plausible identifier promoted by a mechanism that never decided anything
    is what #203 and #263 exist to undo. Any CURIE above is a curator''s to accept
    or reject.'
