  action: ANNOTATED
  changes: 'Edison LITERATURE (PaperQA3) identity research; report at research/ingredients/Colloidal_chitin-edison-literature.md
    (local artifact — research/ is gitignored, so the findings are quoted here rather
    than linked). Report verdict: **Recommended interpretation:** “colloidal chitin”
    is not a discrete small chemical, salt, hydrate, buffer, or invariant commercial
    formulation. It is a **protocol-defined, finely dispersed/pretreated form of the
    chitin polymer**, usually retained as a hydrated preparation or suspension for
    culture media and chitinase assays. In the best recovered preparation-level evidence,
    purified shrimp-derived chitin was treated with concentrated phosphoric acid,
    precipitated by adding water, washed to neutral pH, drained, moisture-assayed,
    and refrigerated. Thus, “colloidal” describes the prepared physical/substrate
    form rather than a new covalent identity (riverasolis2023establishmentofthe pages
    2-3). CURIEs discussed: CHEBI:17029, MeSH:D002798. Recorded as provenance only
