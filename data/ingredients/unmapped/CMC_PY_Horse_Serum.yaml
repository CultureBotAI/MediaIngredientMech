notes: MicrobeDecoder flattened separate Filifactor villosus culture contexts into
  CMC + PY + Horse Serum. Love et al. 1979 (doi:10.1099/00207713-29-3-241) describes
  cooked meat-carbohydrate and peptone-yeast extract cultures supplemented with horse
  serum. CMC is not carboxymethylcellulose here. This source expression is retained
  as AMBIGUOUS until separate source preparations are represented; it has no asserted
  single-mixture components or ontology identity.
